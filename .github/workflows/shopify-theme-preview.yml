name: Shopify Theme Preview (Canonical)

on:
    workflow_call:
        inputs:
            production_branch:
                type: string
                required: false
                default: "production"
            non_preview_branches:
                type: string
                required: false
                default: '["dev","production","prod","main","master"]'
            theme_root:
                type: string
                required: false
                default: ""
            theme_src:
                type: string
                required: false
                default: ""
            theme_dist:
                type: string
                required: false
                default: ""
            build_install_command:
                type: string
                required: false
                default: "npm ci"
            build_command:
                type: string
                required: false
                default: "npx webpack --env target=${GITHUB_BRANCH}"
            enable_preview_backup:
                type: string
                required: false
                default: "true"
            aws_region:
                type: string
                required: false
                default: "us-west-2"
            aws_s3_bucket:
                type: string
                required: false
                default: ""
            shopify_ignore:
                type: string
                required: false
                default: ""
            SHOPIFY_STORE:
                type: string
                required: false
                default: ""
            SHOPIFY_THEME_ID:
                type: string
                required: false
                default: ""
            SHOPIFY_PRODUCTION_THEME_ID:
                type: string
                required: false
                default: ""
            SHOPIFY_PREVIEW_BASE_THEME_ID:
                type: string
                required: false
                default: ""
            SHOPIFY_PREVIEW_STORE:
                description: >-
                    Optional store list (same format as SHOPIFY_STORE) to preview on
                    instead of SHOPIFY_STORE, e.g. only the production stores of a
                    multi-store project. When empty, falls back to the
                    SHOPIFY_PREVIEW_STORE variable (env_vars, then repo/org), then
                    SHOPIFY_STORE.
                type: string
                required: false
                default: ""
            env_vars:
                description: >-
                    Optional toJSON(vars) from a wrapper job that declares an environment
                    (the resolve_env job), so environment-level per-store overrides
                    (NAME__STORE_KEY / NAME_N) and SHOPIFY_PREVIEW_STORE apply.
                    Repo/org-level ones apply without it.
                type: string
                required: false
                default: ""
            preview_mode:
                description: >-
                    auto: build previews on every PR open/push. on_demand: build them
                    only when someone comments the preview command (the wrapper must
                    also trigger on issue_comment). PR close always cleans up.
                type: string
                required: false
                default: "auto"
            preview_command:
                description: "Comment command that requests previews (works in either mode)."
                type: string
                required: false
                default: "/preview"
        secrets:
            SHOPIFY_THEME_ACCESS_TOKEN:
                required: false
            AWS_ACCESS_KEY_ID:
                required: false
            AWS_SECRET_ACCESS_KEY:
                required: false
            IAMOTA_ACTIONS_READ_TOKEN:
                required: false

permissions:
    contents: write
    pull-requests: write

# Only runs that do work share the PR's group, so an ordinary PR comment (or, in
# on_demand mode, a push) can't cancel a preview that is building.
concurrency:
    group: iamota-shopify-theme-preview-${{ ((github.event_name == 'pull_request' && (github.event.action == 'closed' || inputs.preview_mode != 'on_demand')) || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, inputs.preview_command))) && format('pr-{0}', github.event.pull_request.number || github.event.issue.number) || github.run_id }}
    cancel-in-progress: true

jobs:
    # What this run does: preview | cleanup | help | reply | skip. Normalizes the
    # PR (number, refs, SHAs) for pull_request and issue_comment events alike.
    context:
        runs-on: ubuntu-latest
        outputs:
            action      : ${{ steps.request.outputs.action }}
            reason      : ${{ steps.request.outputs.reason }}
            mode        : ${{ steps.request.outputs.mode }}
            fresh       : ${{ steps.request.outputs.fresh }}
            pr_number   : ${{ steps.request.outputs.pr_number }}
            head_ref    : ${{ steps.request.outputs.head_ref }}
            head_sha    : ${{ steps.request.outputs.head_sha }}
            base_sha    : ${{ steps.request.outputs.base_sha }}
            checkout_ref: ${{ steps.request.outputs.checkout_ref }}
            comment_id  : ${{ steps.request.outputs.comment_id }}
        steps:
            - id: request
              uses: iamota/iamota-github-actions/.github/actions/github-pr-preview-request@test/preview-on-demand
              with:
                  mode: ${{ inputs.preview_mode }}
                  command: ${{ inputs.preview_command }}

            - name: Acknowledge preview command
              if: steps.request.outputs.comment_id != '' && (steps.request.outputs.action == 'preview' || steps.request.outputs.action == 'cleanup')
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMMENT_ID: ${{ steps.request.outputs.comment_id }}
              run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes --silent

            - name: Reply to preview command
              if: steps.request.outputs.action == 'reply'
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMMENT_ID: ${{ steps.request.outputs.comment_id }}
                  PR_NUMBER: ${{ steps.request.outputs.pr_number }}
                  REASON: ${{ steps.request.outputs.reason }}
              run: |
                  set -euo pipefail
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=confused --silent || true
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${REASON}" --silent

    resolve_targets:
        needs: [context]
        if: contains(fromJSON('["preview","cleanup","help"]'), needs.context.outputs.action)
        runs-on: ubuntu-latest
        outputs:
            matrix_json: ${{ steps.stores.outputs.matrix_json }}
            first_store: ${{ steps.stores.outputs.first_store }}
            skip_preview: ${{ steps.branch_policy.outputs.skip_preview }}
        steps:
            # Preview targets: SHOPIFY_PREVIEW_STORE (input, environment var, repo/org
            # var) narrows the fan-out, e.g. to production stores only; otherwise
            # every SHOPIFY_STORE store gets a preview.
            - id: stores
              uses: iamota/iamota-github-actions/.github/actions/shopify-multistore-matrix@test/preview-on-demand
              with:
                  stores: ${{ inputs.SHOPIFY_PREVIEW_STORE || fromJSON(inputs.env_vars || '{}').SHOPIFY_PREVIEW_STORE || vars.SHOPIFY_PREVIEW_STORE || inputs.SHOPIFY_STORE }}
            - id: branch_policy
              env:
                  HEAD_REF: ${{ needs.context.outputs.head_ref }}
                  PRODUCTION_BRANCH: ${{ inputs.production_branch }}
                  NON_PREVIEW_BRANCHES: ${{ inputs.non_preview_branches }}
              run: |
                  set -euo pipefail
                  SKIP_PREVIEW="$(
                      node -e '
                      const head = String(process.env.HEAD_REF || "").trim().toLowerCase();
                      const productionBranch = String(process.env.PRODUCTION_BRANCH || "").trim().toLowerCase();
                      const raw = String(process.env.NON_PREVIEW_BRANCHES || "").trim();

                      function globToRegExp(glob) {
                        const escaped = String(glob)
                          .replace(/[|\\{}()[\]^$+?.]/g, "\\$&")
                          .replace(/\*/g, ".*");
                        return new RegExp(`^${escaped}$`);
                      }

                      let branches = [];
                      try {
                        branches = raw ? JSON.parse(raw) : [];
                      } catch {
                        throw new Error(`Invalid non_preview_branches JSON array: ${raw}`);
                      }

                      if (!Array.isArray(branches) || !branches.every((x) => typeof x === "string")) {
                        throw new Error("non_preview_branches must be a JSON array of strings");
                      }

                      const blocked = new Set(
                        [...branches, productionBranch]
                          .map((x) => String(x || "").trim().toLowerCase())
                          .filter(Boolean)
                      );

                      const skip = [...blocked].some((pattern) => globToRegExp(pattern).test(head));
                      process.stdout.write(skip ? "true" : "false");
                      '
                  )"
                  echo "skip_preview=${SKIP_PREVIEW}" >> "$GITHUB_OUTPUT"

    install_dependencies:
        needs: [context, resolve_targets]
        if: needs.context.outputs.action == 'preview' && needs.resolve_targets.outputs.skip_preview != 'true'
        runs-on: ubuntu-latest
        outputs:
            theme_root_effective: ${{ steps.inputs.outputs.theme_root_effective }}
            npm_install_ran: ${{ steps.nm_cache.outputs.cache-hit == 'true' || steps.npm.outputs.ran == 'true' }}
            node_modules_cache_key: ${{ steps.nm_cache_key.outputs.key }}
            node_modules_cache_path: ${{ steps.nm_cache_key.outputs.path }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ needs.context.outputs.checkout_ref }}

            - name: Resolve theme root path
              id: resolve_theme_root
              uses: iamota/iamota-github-actions/.github/actions/shopify-multistore-resolve-value@test/preview-on-demand
              with:
                  store: ${{ needs.resolve_targets.outputs.first_store }}
                  raw: ${{ inputs.theme_root }}

            - id: inputs
              run: |
                  set -euo pipefail
                  ROOT="${{ steps.resolve_theme_root.outputs.value }}"
                  if [ -z "${ROOT}" ]; then
                      ROOT="."
                  fi
                  if [ ! -d "${ROOT}" ]; then
                      echo "THEME_ROOT directory not found: ${ROOT}"
                      exit 1
                  fi
                  echo "theme_root_effective=${ROOT}" >> "$GITHUB_OUTPUT"

            - name: Resolve npm cache dependency path
              id: npm_cache
              env:
                  THEME_ROOT_EFFECTIVE: ${{ steps.inputs.outputs.theme_root_effective }}
              run: |
                  set -euo pipefail
                  ROOT="${THEME_ROOT_EFFECTIVE}"
                  if [ -f "${ROOT}/package-lock.json" ]; then
                      {
                          echo "enabled=true"
                          echo "dependency_path=${ROOT}/package-lock.json"
                      } >> "$GITHUB_OUTPUT"
                  elif [ -f "${ROOT}/npm-shrinkwrap.json" ]; then
                      {
                          echo "enabled=true"
                          echo "dependency_path=${ROOT}/npm-shrinkwrap.json"
                      } >> "$GITHUB_OUTPUT"
                  else
                      echo "enabled=false" >> "$GITHUB_OUTPUT"
                      echo "No npm lockfile found for cache restore under ${ROOT}; skipping npm cache."
                  fi

            - name: Compute node_modules cache key
              id: nm_cache_key
              env:
                  DEP_PATH: ${{ steps.npm_cache.outputs.dependency_path }}
                  DEP_ENABLED: ${{ steps.npm_cache.outputs.enabled }}
                  THEME_ROOT_EFFECTIVE: ${{ steps.inputs.outputs.theme_root_effective }}
              run: |
                  set -euo pipefail
                  if [ "${DEP_ENABLED}" != "true" ] || [ -z "${DEP_PATH}" ]; then
                      echo "key=" >> "$GITHUB_OUTPUT"
                      echo "path=" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  HASH="$(sha256sum "${DEP_PATH}" | awk '{print $1}')"
                  echo "key=node-modules-${{ runner.os }}-shopify-theme-preview-${HASH}" >> "$GITHUB_OUTPUT"
                  echo "path=${THEME_ROOT_EFFECTIVE}/node_modules" >> "$GITHUB_OUTPUT"

            - name: Restore/save node_modules cache
              if: steps.npm_cache.outputs.enabled == 'true'
              id: nm_cache
              uses: actions/cache@v5
              with:
                  path: ${{ steps.nm_cache_key.outputs.path }}
                  key: ${{ steps.nm_cache_key.outputs.key }}

            - name: Setup Node with npm cache
              if: steps.npm_cache.outputs.enabled == 'true' && steps.nm_cache.outputs.cache-hit != 'true'
              uses: actions/setup-node@v6
              with:
                  # Node baseline — keep in sync with docs/github-actions/node-version.md.
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: ${{ steps.npm_cache.outputs.dependency_path }}

            - name: Resolve build install command
              id: resolve_build_install
              uses: iamota/iamota-github-actions/.github/actions/shopify-multistore-resolve-value@test/preview-on-demand
              with:
                  store: ${{ needs.resolve_targets.outputs.first_store }}
                  raw: ${{ inputs.build_install_command }}

            - name: NPM install (self-aware)
              if: steps.npm_cache.outputs.enabled != 'true' || steps.nm_cache.outputs.cache-hit != 'true'
              id: npm
              uses: iamota/iamota-github-actions/.github/actions/npm-install@test/preview-on-demand
              with:
                  working_directory: ${{ steps.inputs.outputs.theme_root_effective }}
                  install_command: ${{ steps.resolve_build_install.outputs.value }}
                  if_package_json: "1"

    shopify_theme_preview:
        needs: [context, resolve_targets, install_dependencies]
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.resolve_targets.outputs.matrix_json) }}
        if: needs.context.outputs.action == 'preview' && needs.resolve_targets.outputs.skip_preview != 'true'
        runs-on: ubuntu-latest
        env:
            TARGET_STORE                          : ${{ matrix.store }}
            TARGET_STORE_SLUG                     : ${{ matrix.store_slug }}
            TARGET_STORE_INDEX                    : ${{ matrix.store_index }}
            TARGET_STORE_SECRET_KEY               : ${{ matrix.store_secret_key }}
            RAW_THEME_ROOT                        : ${{ inputs.theme_root }}
            RAW_THEME_SRC                         : ${{ inputs.theme_src }}
            RAW_THEME_DIST                        : ${{ inputs.theme_dist }}
            RAW_BUILD_INSTALL_COMMAND             : ${{ inputs.build_install_command }}
            RAW_BUILD_COMMAND                     : ${{ inputs.build_command }}
            RAW_SHOPIFY_IGNORE                    : ${{ inputs.shopify_ignore }}
            RAW_ENABLE_PREVIEW_BACKUP             : ${{ inputs.enable_preview_backup }}
            RAW_AWS_REGION                        : ${{ inputs.aws_region }}
            RAW_AWS_S3_BUCKET                     : ${{ inputs.aws_s3_bucket }}
            RAW_AWS_ACCESS_KEY_ID                 : ${{ secrets.AWS_ACCESS_KEY_ID }}
            RAW_AWS_ACCESS_KEY_ID_NAMED           : ${{ secrets[format('AWS_ACCESS_KEY_ID__{0}', matrix.store_secret_key)] }}
            RAW_AWS_ACCESS_KEY_ID_INDEXED         : ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', matrix.store_index)] }}
            RAW_AWS_SECRET_ACCESS_KEY             : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            RAW_AWS_SECRET_ACCESS_KEY_NAMED       : ${{ secrets[format('AWS_SECRET_ACCESS_KEY__{0}', matrix.store_secret_key)] }}
            RAW_AWS_SECRET_ACCESS_KEY_INDEXED     : ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', matrix.store_index)] }}
            RAW_SHOPIFY_THEME_ID                  : ${{ inputs.SHOPIFY_THEME_ID }}
            RAW_SHOPIFY_PRODUCTION_THEME_ID       : ${{ inputs.SHOPIFY_PRODUCTION_THEME_ID }}
            RAW_SHOPIFY_PREVIEW_BASE_ID           : ${{ inputs.SHOPIFY_PREVIEW_BASE_THEME_ID }}
            RAW_SHOPIFY_THEME_ACCESS_TOKEN        : ${{ secrets.SHOPIFY_THEME_ACCESS_TOKEN }}
            RAW_SHOPIFY_THEME_ACCESS_TOKEN_NAMED  : ${{ secrets[format('SHOPIFY_THEME_ACCESS_TOKEN__{0}', matrix.store_secret_key)] }}
            RAW_SHOPIFY_THEME_ACCESS_TOKEN_INDEXED: ${{ secrets[format('SHOPIFY_THEME_ACCESS_TOKEN_{0}', matrix.store_index)] }}
            RAW_IAMOTA_ACTIONS_READ_TOKEN         : ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
            RAW_IAMOTA_ACTIONS_READ_TOKEN_NAMED   : ${{ secrets[format('IAMOTA_ACTIONS_READ_TOKEN__{0}', matrix.store_secret_key)] }}
            RAW_IAMOTA_ACTIONS_READ_TOKEN_INDEXED : ${{ secrets[format('IAMOTA_ACTIONS_READ_TOKEN_{0}', matrix.store_index)] }}
            SHOPIFY_CLI_TTY                       : "0"

        steps:
            - name: Checkout PR head
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.context.outputs.checkout_ref }}
                  fetch-depth: 0

            # Stages variables so "Resolve store-scoped values" can apply per-store
            # NAME__STORE_KEY / NAME_N overrides.
            - name: Load per-store variable overrides
              uses: iamota/iamota-github-actions/.github/actions/multistore-vars-load@test/preview-on-demand
              with:
                  vars_json: ${{ toJSON(vars) }}
                  env_vars_json: ${{ inputs.env_vars }}

            - name: Resolve effective AWS access key id
              id: resolve_aws_access_key_id
              uses: iamota/iamota-github-actions/.github/actions/multistore-resolve-secret@test/preview-on-demand
              with:
                  store: ${{ env.TARGET_STORE }}
                  raw: ${{ env.RAW_AWS_ACCESS_KEY_ID }}
                  raw_named: ${{ env.RAW_AWS_ACCESS_KEY_ID_NAMED }}
                  raw_indexed: ${{ env.RAW_AWS_ACCESS_KEY_ID_INDEXED }}

            - name: Resolve effective AWS secret access key
              id: resolve_aws_secret_access_key
              uses: iamota/iamota-github-actions/.github/actions/multistore-resolve-secret@test/preview-on-demand
              with:
                  store: ${{ env.TARGET_STORE }}
                  raw: ${{ env.RAW_AWS_SECRET_ACCESS_KEY }}
                  raw_named: ${{ env.RAW_AWS_SECRET_ACCESS_KEY_NAMED }}
                  raw_indexed: ${{ env.RAW_AWS_SECRET_ACCESS_KEY_INDEXED }}

            - name: Resolve effective Shopify token
              id: resolve_shopify_theme_access_token
              uses: iamota/iamota-github-actions/.github/actions/multistore-resolve-secret@test/preview-on-demand
              with:
                  store: ${{ env.TARGET_STORE }}
                  raw: ${{ env.RAW_SHOPIFY_THEME_ACCESS_TOKEN }}
                  raw_named: ${{ env.RAW_SHOPIFY_THEME_ACCESS_TOKEN_NAMED }}
                  raw_indexed: ${{ env.RAW_SHOPIFY_THEME_ACCESS_TOKEN_INDEXED }}

            - name: Resolve store-scoped values
              env:
                  RESOLVED_AWS_ACCESS_KEY_ID: ${{ steps.resolve_aws_access_key_id.outputs.value }}
                  RESOLVED_AWS_SECRET_ACCESS_KEY: ${{ steps.resolve_aws_secret_access_key.outputs.value }}
                  RESOLVED_SHOPIFY_THEME_ACCESS_TOKEN: ${{ steps.resolve_shopify_theme_access_token.outputs.value }}
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require("node:fs");

                  function normalizeStore(v) {
                    let s = String(v ?? "").trim();
                    if (!s) return "";
                    s = s.replace(/^https?:\/\//i, "");
                    s = s.split("/")[0].trim().toLowerCase();
                    if (!s) return "";
                    if (!s.includes(".")) s = `${s}.myshopify.com`;
                    return s;
                  }

                  function resolveValue(raw, store) {
                    const val = String(raw ?? "");
                    const trimmed = val.trim();
                    if (!trimmed) return "";
                    if (!(trimmed.startsWith("{") && trimmed.endsWith("}"))) return val;
                    let obj;
                    try { obj = JSON.parse(trimmed); } catch { return val; }
                    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return val;
                    const normalized = normalizeStore(store);
                    const slug = normalized.replace(/\.myshopify\.com$/i, "");
                    for (const k of [store, normalized, slug, String(store || "").toLowerCase(), String(slug || "").toLowerCase()]) {
                      if (!k) continue;
                      if (Object.prototype.hasOwnProperty.call(obj, k)) {
                        const out = obj[k];
                        if (out === undefined || out === null) return "";
                        if (typeof out === "string") return out;
                        if (typeof out === "number" || typeof out === "boolean") return String(out);
                        return JSON.stringify(out);
                      }
                    }
                    return "";
                  }

                  const store = process.env.TARGET_STORE || "";
                  const envFile = process.env.GITHUB_ENV;
                  const marker = `iamota-shopify-preview-${(process.env.TARGET_STORE_SLUG || "").replace(/[^a-zA-Z0-9_-]/g, "_")}`;

                  // Per-store variable overrides staged by multistore-vars-load: for each
                  // name, NAME__STORE_KEY then NAME_N win over the wrapper's JSON/scalar value.
                  // Same rules as shopify-multistore-resolve-value.
                  let storeVars = {};
                  try {
                    if (process.env.IAMOTA_STORE_VARS_FILE) storeVars = JSON.parse(fs.readFileSync(process.env.IAMOTA_STORE_VARS_FILE, "utf8")) || {};
                  } catch { storeVars = {}; }
                  const storeKey = process.env.TARGET_STORE_SECRET_KEY || "";
                  const storeIndex = process.env.TARGET_STORE_INDEX || "";
                  function pick(names, raw) {
                    for (const name of names) {
                      for (const variable of [storeKey && `${name}__${storeKey}`, storeIndex && `${name}_${storeIndex}`]) {
                        if (!variable) continue;
                        const v = storeVars[variable];
                        if (v !== undefined && v !== null && String(v) !== "") {
                          console.log(`${name}: using ${variable}`);
                          return String(v);
                        }
                      }
                    }
                    return resolveValue(raw, store);
                  }

                  const productionThemeId = pick(["SHOPIFY_PRODUCTION_THEME_ID"], process.env.RAW_SHOPIFY_PRODUCTION_THEME_ID) || "";
                  const previewBaseId = pick(["SHOPIFY_PREVIEW_BASE_THEME_ID", "SHOPIFY_PRODUCTION_THEME_ID"], process.env.RAW_SHOPIFY_PREVIEW_BASE_ID) || "";

                  // THEME_ROOT and BUILD_INSTALL_COMMAND stay repo-wide: node_modules is
                  // installed once (install_dependencies) and shared by every store.
                  const resolvedThemeRoot = resolveValue(process.env.RAW_THEME_ROOT, store) || ".";
                  const resolvedThemeSrc = pick(["THEME_SRC"], process.env.RAW_THEME_SRC) || (resolvedThemeRoot !== "." ? resolvedThemeRoot : "src");

                  const values = {
                    SHOPIFY_STORE: store,
                    THEME_ROOT: resolvedThemeRoot,
                    THEME_SRC: resolvedThemeSrc,
                    THEME_DIST: pick(["THEME_DIST"], process.env.RAW_THEME_DIST) || "",
                    BUILD_INSTALL_COMMAND: resolveValue(process.env.RAW_BUILD_INSTALL_COMMAND, store) || "npm ci",
                    BUILD_COMMAND: pick(["BUILD_COMMAND"], process.env.RAW_BUILD_COMMAND) || "npx webpack --env target=${GITHUB_BRANCH}",
                    SHOPIFY_IGNORE: pick(["SHOPIFY_IGNORE"], process.env.RAW_SHOPIFY_IGNORE) || "",
                    ENABLE_PREVIEW_BACKUP: pick(["ENABLE_PREVIEW_BACKUP"], process.env.RAW_ENABLE_PREVIEW_BACKUP) || "true",
                    AWS_REGION: pick(["AWS_REGION"], process.env.RAW_AWS_REGION) || "us-west-2",
                    AWS_S3_BUCKET: pick(["AWS_S3_BUCKET_SHOPIFY_BACKUPS"], process.env.RAW_AWS_S3_BUCKET) || "",
                    AWS_ACCESS_KEY_ID: process.env.RESOLVED_AWS_ACCESS_KEY_ID || "",
                    AWS_SECRET_ACCESS_KEY: process.env.RESOLVED_AWS_SECRET_ACCESS_KEY || "",
                    SHOPIFY_THEME_ID: pick(["SHOPIFY_THEME_ID"], process.env.RAW_SHOPIFY_THEME_ID) || "",
                    SHOPIFY_PRODUCTION_THEME_ID: productionThemeId,
                    SHOPIFY_PREVIEW_BASE_ID: previewBaseId || productionThemeId || "",
                    SHOPIFY_THEME_ACCESS_TOKEN: process.env.RESOLVED_SHOPIFY_THEME_ACCESS_TOKEN || "",
                    PREVIEW_MARKER: marker,
                  };

                  for (const [k, v] of Object.entries(values)) {
                    fs.appendFileSync(envFile, `${k}<<EOF\n${v}\nEOF\n`);
                  }
                  NODE

            - name: Validate required Shopify values
              run: |
                  set -euo pipefail
                  MISSING=()
                  [ -n "${SHOPIFY_STORE:-}" ] || MISSING+=("SHOPIFY_STORE input/var")
                  if [ -z "${SHOPIFY_PREVIEW_BASE_ID:-}" ] && [ -z "${SHOPIFY_PRODUCTION_THEME_ID:-}" ]; then
                      MISSING+=("SHOPIFY_PREVIEW_BASE_THEME_ID or SHOPIFY_PRODUCTION_THEME_ID input/var")
                  fi
                  [ -n "${SHOPIFY_THEME_ACCESS_TOKEN:-}" ] || MISSING+=("SHOPIFY_THEME_ACCESS_TOKEN secret")
                    if [ "${#MISSING[@]}" -gt 0 ]; then
                        echo "Missing required Shopify values: ${MISSING[*]}"
                        exit 1
                    fi

            - name: Setup Node + Install Shopify CLI
              uses: iamota/iamota-github-actions/.github/actions/shopify-cli-install@test/preview-on-demand
              with:
                  cli_version: ${{ vars.SHOPIFY_CLI_VERSION }}

            - name: Checkout helper scripts
              id: helper_checkout
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@test/preview-on-demand
              with:
                  token: ${{ env.RAW_IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Verify helper checkout
              run: |
                  set -euo pipefail
                  echo "Helper checkout ref: ${{ steps.helper_checkout.outputs.ref }}"
                  echo "Workspace: ${GITHUB_WORKSPACE}"
                  if [ -d "${GITHUB_WORKSPACE}/.iamota-actions" ]; then
                      git -C "${GITHUB_WORKSPACE}/.iamota-actions" rev-parse HEAD || true
                      find "${GITHUB_WORKSPACE}/.iamota-actions/.github/scripts" -maxdepth 3 -type f | sort || true
                  else
                      echo ".iamota-actions directory is missing after helper checkout."
                      ls -la "${GITHUB_WORKSPACE}" || true
                      exit 1
                  fi

            - name: Resolve source theme id and store metadata
              id: source
              run: |
                  set -euo pipefail

                  SOURCE_THEME_ID="${SHOPIFY_PREVIEW_BASE_ID:-}"
                  if [ -z "${SOURCE_THEME_ID}" ]; then
                      SOURCE_THEME_ID="${SHOPIFY_PRODUCTION_THEME_ID}"
                  fi
                  if [ -z "${SOURCE_THEME_ID}" ]; then
                      echo "Unable to resolve source theme id. Set SHOPIFY_PREVIEW_BASE_THEME_ID or SHOPIFY_PRODUCTION_THEME_ID."
                      exit 1
                  fi

                  SRC_STORE_RAW="${SHOPIFY_STORE:-unknown-store.myshopify.com}"
                  SRC_HOST="${SRC_STORE_RAW#https://}"
                  SRC_HOST="${SRC_HOST#http://}"
                  SRC_HOST="${SRC_HOST%%/*}"
                  [ -n "${SRC_HOST}" ] || SRC_HOST="unknown-store.myshopify.com"
                  if ! echo "${SRC_HOST}" | grep -q '\.'; then
                      SRC_HOST="${SRC_HOST}.myshopify.com"
                  fi
                  SRC_STORE="${SRC_HOST%.myshopify.com}"
                  [ -n "${SRC_STORE}" ] || SRC_STORE="unknown-store"

                  SCRIPT_PATH="${GITHUB_WORKSPACE}/.iamota-actions/.github/scripts/shopify/shopify-theme-id-resolve.mjs"
                  if [ ! -f "${SCRIPT_PATH}" ]; then
                      echo "Helper checkout ref: ${{ steps.helper_checkout.outputs.ref }}"
                      echo "Workspace: ${GITHUB_WORKSPACE}"
                      ls -la "${GITHUB_WORKSPACE}" || true
                      ls -la "${GITHUB_WORKSPACE}/.iamota-actions" || true
                      find "${GITHUB_WORKSPACE}/.iamota-actions/.github/scripts" -maxdepth 3 -type f | sort || true
                      echo "Required helper script not found: ${SCRIPT_PATH}"
                      exit 1
                  fi

                  SOURCE_THEME_ID="$(
                      node "${SCRIPT_PATH}" \
                          --store "${SRC_HOST}" \
                          --theme-id "${SOURCE_THEME_ID}" \
                          --token "${SHOPIFY_THEME_ACCESS_TOKEN}"
                  )"

                  echo "source_theme_id=${SOURCE_THEME_ID}" >> "$GITHUB_OUTPUT"
                  echo "source_store_slug=${SRC_STORE}" >> "$GITHUB_OUTPUT"
                  echo "source_store_host=${SRC_HOST}" >> "$GITHUB_OUTPUT"

            - name: Resolve preview theme id from PR marker (if any)
              id: marker
              env:
                  GH_TOKEN: ${{ github.token }}
              uses: iamota/iamota-github-actions/.github/actions/github-pr-comment-marker-get@test/preview-on-demand
              with:
                  repo: ${{ github.repository }}
                  pr: ${{ needs.context.outputs.pr_number }}
                  marker: ${{ env.PREVIEW_MARKER }}
                  extract_regex: theme_id=(\d+)
                  refresh_after_comments: "75"

            # /preview fresh rebuilds from the live theme: the existing preview is
            # backed up below as usual, then deleted and re-created.
            - name: Resolve existing preview theme
              id: existing
              env:
                  MARKER_THEME_ID: ${{ steps.marker.outputs.extracted_value }}
                  FRESH: ${{ needs.context.outputs.fresh }}
              run: |
                  set -euo pipefail
                  if [ "${FRESH}" = "true" ]; then
                      echo "theme_id=" >> "$GITHUB_OUTPUT"
                      [ -z "${MARKER_THEME_ID}" ] || echo "Fresh rebuild: replacing preview theme ${MARKER_THEME_ID}."
                  else
                      echo "theme_id=${MARKER_THEME_ID}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Prepare preview backup filename
              if: steps.marker.outputs.extracted_value != '' && env.ENABLE_PREVIEW_BACKUP == 'true'
              env:
                  HEAD_REF: ${{ needs.context.outputs.head_ref }}
              run: |
                  set -euo pipefail
                  PR_NUMBER="${{ needs.context.outputs.pr_number }}"
                  BRANCH="${HEAD_REF}"
                  THEME_ID="${{ steps.marker.outputs.extracted_value }}"
                  TS="$(TZ=America/Los_Angeles date '+%Y-%m-%d_%H%M%S_%Z')"
                  REPO_NAME="$(basename "${{ github.repository }}")"
                  SAFE_BRANCH="$(echo "${BRANCH}" | tr '/' '_')"
                  ZIP_NAME="${REPO_NAME}__PR${PR_NUMBER}__${SAFE_BRANCH}__preview_theme_${THEME_ID}__${TS}.zip"
                  echo "PREVIEW_BACKUP_DIR=preview_backup" >> "$GITHUB_ENV"
                  echo "PREVIEW_BACKUP_ZIP=${ZIP_NAME}" >> "$GITHUB_ENV"
                  echo "PREVIEW_S3_DEST=shopify-preview-backups/${ZIP_NAME}" >> "$GITHUB_ENV"

            - name: Pull existing preview theme for backup
              if: steps.marker.outputs.extracted_value != '' && env.ENABLE_PREVIEW_BACKUP == 'true'
              uses: iamota/iamota-github-actions/.github/actions/shopify-theme-backup@test/preview-on-demand
              with:
                  store: ${{ env.SHOPIFY_STORE }}
                  theme_id: ${{ steps.marker.outputs.extracted_value }}
                  token: ${{ env.SHOPIFY_THEME_ACCESS_TOKEN }}
                  output_dir: ${{ env.PREVIEW_BACKUP_DIR }}
                  zip_output: ${{ env.PREVIEW_BACKUP_ZIP }}

            - name: Configure AWS credentials (optional)
              if: steps.marker.outputs.extracted_value != '' && env.ENABLE_PREVIEW_BACKUP == 'true' && env.AWS_S3_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Upload preview backup zip to S3 (optional)
              if: steps.marker.outputs.extracted_value != '' && env.ENABLE_PREVIEW_BACKUP == 'true' && env.AWS_S3_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
              uses: iamota/iamota-github-actions/.github/actions/aws-s3-upload@test/preview-on-demand
              with:
                  file: ${{ env.PREVIEW_BACKUP_ZIP }}
                  bucket: ${{ env.AWS_S3_BUCKET }}
                  dest_path: ${{ env.PREVIEW_S3_DEST }}

            - name: Upload preview backup artifact (optional)
              if: steps.marker.outputs.extracted_value != '' && env.ENABLE_PREVIEW_BACKUP == 'true'
              uses: iamota/iamota-github-actions/.github/actions/github-artifact-upload@test/preview-on-demand
              with:
                  name: shopify-preview-backup-pr-${{ needs.context.outputs.pr_number }}-${{ env.TARGET_STORE_SLUG }}
                  path: ${{ env.PREVIEW_BACKUP_ZIP }}

            - name: Delete existing preview theme (fresh rebuild)
              if: needs.context.outputs.fresh == 'true' && steps.marker.outputs.extracted_value != ''
              uses: iamota/iamota-github-actions/.github/actions/shopify-theme-delete@test/preview-on-demand
              with:
                  store: ${{ env.SHOPIFY_STORE }}
                  theme_id: ${{ steps.marker.outputs.extracted_value }}
                  token: ${{ env.SHOPIFY_THEME_ACCESS_TOKEN }}
                  ignore_not_found: "true"

            # Shopify rejects theme names over 50 characters, so long branch names
            # drop a leading type prefix (feature/, fix/, ...) and then keep their
            # tail, which is usually the distinctive part.
            - name: Build preview theme name
              id: theme_name
              env:
                  HEAD_REF: ${{ needs.context.outputs.head_ref }}
                  PR_NUMBER: ${{ needs.context.outputs.pr_number }}
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require("fs");
                  const MAX = 50;
                  const prefix = "iamota (";
                  const suffix = `) PR#${process.env.PR_NUMBER || ""}`;
                  let branch = String(process.env.HEAD_REF || "")
                    .replace(/^(feature|feat|fix|bugfix|hotfix|chore|release|refactor|task|issue|docs|test|ci|build|perf|style)\//i, "");
                  const budget = MAX - prefix.length - suffix.length;
                  const chars = Array.from(branch);
                  if (chars.length > budget) branch = `...${chars.slice(-(budget - 3)).join("")}`;
                  const name = `${prefix}${branch}${suffix}`;
                  console.log(`Preview theme name: ${name} (${Array.from(name).length} chars)`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `name<<EOF\n${name}\nEOF\n`);
                  NODE

            - name: Create preview theme (duplicate base) if missing
              if: steps.existing.outputs.theme_id == ''
              id: createtheme
              uses: iamota/iamota-github-actions/.github/actions/shopify-theme-create@test/preview-on-demand
              with:
                  store: ${{ env.SHOPIFY_STORE }}
                  base_theme_id: ${{ env.SHOPIFY_PREVIEW_BASE_ID }}
                  token: ${{ env.SHOPIFY_THEME_ACCESS_TOKEN }}
                  name: ${{ steps.theme_name.outputs.name }}

            - name: Determine preview theme id
              id: finaltheme
              run: |
                  set -euo pipefail
                  if [ -n "${{ steps.existing.outputs.theme_id }}" ]; then
                      echo "theme_id=${{ steps.existing.outputs.theme_id }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "theme_id=${{ steps.createtheme.outputs.theme_id }}" >> "$GITHUB_OUTPUT"
                  fi
                  if [ -z "${{ steps.existing.outputs.theme_id }}" ] && [ -z "${{ steps.createtheme.outputs.theme_id }}" ]; then
                      echo "Failed to resolve preview theme id from marker or create step."
                      exit 1
                  fi

            - name: Determine delete behavior
              id: deleteflag
              run: |
                  set -euo pipefail
                  ALLOW_DELETE="false"
                  if git log -1 --pretty=%B | grep -q '\[Allow Delete\]'; then
                      ALLOW_DELETE="true"
                  fi
                  if [ "${ALLOW_DELETE}" = "true" ]; then
                      echo "nodelete=0" >> "$GITHUB_OUTPUT"
                  else
                      echo "nodelete=1" >> "$GITHUB_OUTPUT"
                  fi

            - name: Restore node_modules
              uses: iamota/iamota-github-actions/.github/actions/node-modules-restore@test/preview-on-demand
              with:
                  cache_key: ${{ needs.install_dependencies.outputs.node_modules_cache_key }}
                  cache_path: ${{ needs.install_dependencies.outputs.node_modules_cache_path }}
                  theme_root: ${{ env.THEME_ROOT }}

            - name: Prepare theme (install + build + resolve dist)
              id: prepare
              uses: iamota/iamota-github-actions/.github/actions/shopify-theme-prepare@test/preview-on-demand
              env:
                  GITHUB_BRANCH: ${{ needs.context.outputs.head_ref }}
              with:
                  theme_root: ${{ env.THEME_ROOT }}
                  theme_src: ${{ env.THEME_SRC }}
                  theme_dist: ${{ env.THEME_DIST }}
                  build_install_command: ${{ env.BUILD_INSTALL_COMMAND }}
                  build_command: ${{ env.BUILD_COMMAND }}

            - name: Ignore unchanged JSON files for preview push
              run: |
                  set -euo pipefail

                  SRC_ROOT="${{ steps.prepare.outputs.theme_src_effective }}"
                  SRC_ROOT="${SRC_ROOT#./}"
                  SRC_ROOT="${SRC_ROOT%/}"
                  [ -n "${SRC_ROOT}" ] || SRC_ROOT="."

                  DIST_ROOT="${{ steps.prepare.outputs.theme_dist_effective }}"
                  DIST_ROOT="${DIST_ROOT#./}"
                  DIST_ROOT="${DIST_ROOT%/}"
                  [ -n "${DIST_ROOT}" ] || DIST_ROOT="."

                  BASE_SHA="${{ needs.context.outputs.base_sha }}"
                  HEAD_SHA="${{ needs.context.outputs.head_sha }}"

                  CHANGED_REL="/tmp/preview-json-changed.rel.txt"
                  DIST_REL="/tmp/preview-json-dist.rel.txt"
                  IGNORE_REL="/tmp/preview-json-ignore.rel.txt"

                  git diff --name-only --diff-filter=ACMRT "${BASE_SHA}...${HEAD_SHA}" -- "${SRC_ROOT}" \
                    | awk -v src="${SRC_ROOT}/" 'tolower($0) ~ /\.json$/ { p=$0; if (src == "./") { print p; next } if (index(p, src) == 1) print substr(p, length(src)+1) }' \
                    | sed 's#^\\./##' \
                    | sort -u > "${CHANGED_REL}"

                  find "${DIST_ROOT}" -type f -name '*.json' \
                    | sed "s#^${DIST_ROOT%/}/##" \
                    | sed 's#^\\./##' \
                    | sort -u > "${DIST_REL}"

                  comm -23 "${DIST_REL}" "${CHANGED_REL}" > "${IGNORE_REL}" || true

                  IGNORE_FILE="${DIST_ROOT%/}/.shopifyignore"
                  START_MARKER="# iamota-preview-unchanged-json:start"
                  END_MARKER="# iamota-preview-unchanged-json:end"

                  if [ -f "${IGNORE_FILE}" ]; then
                    awk -v s="${START_MARKER}" -v e="${END_MARKER}" '
                      $0==s { inblk=1; next }
                      $0==e { inblk=0; next }
                      !inblk { print }
                    ' "${IGNORE_FILE}" > "${IGNORE_FILE}.tmp"
                    mv "${IGNORE_FILE}.tmp" "${IGNORE_FILE}"
                  else
                    : > "${IGNORE_FILE}"
                  fi

                  if [ -s "${IGNORE_REL}" ]; then
                    {
                      echo "${START_MARKER}"
                      cat "${IGNORE_REL}"
                      echo "${END_MARKER}"
                    } >> "${IGNORE_FILE}"
                  fi

                  echo "Unchanged JSON ignore count: $(wc -l < "${IGNORE_REL}" | tr -d ' ')"

            - name: Push branch theme output into preview theme
              id: push
              uses: iamota/iamota-github-actions/.github/actions/shopify-theme-push@test/preview-on-demand
              with:
                  store: ${{ env.SHOPIFY_STORE }}
                  theme_id: ${{ steps.finaltheme.outputs.theme_id }}
                  token: ${{ env.SHOPIFY_THEME_ACCESS_TOKEN }}
                  path: ${{ steps.prepare.outputs.theme_dist_effective }}
                  nodelete: ${{ steps.deleteflag.outputs.nodelete }}
                  ignore: ${{ env.SHOPIFY_IGNORE }}
                  json: "1"

            - name: Validate preview publish outputs
              run: |
                  set -euo pipefail
                  if [ -z "${{ steps.finaltheme.outputs.theme_id }}" ]; then
                      echo "Preview Theme ID is empty after publish."
                      exit 1
                  fi
                  if [ -z "${{ steps.push.outputs.preview_url }}" ]; then
                      echo "Preview URL is empty after publish."
                      exit 1
                  fi

            - name: Rename preview theme to canonical name
              env:
                  NAME: ${{ steps.theme_name.outputs.name }}
              run: |
                  set -euo pipefail
                  THEME_ID="${{ steps.finaltheme.outputs.theme_id }}"
                  shopify theme rename \
                      --store "${SHOPIFY_STORE}" \
                      --theme "${THEME_ID}" \
                      --name "${NAME}" \
                      --password "${SHOPIFY_THEME_ACCESS_TOKEN}" \
                      --no-color

            - name: Build preview comment metadata
              id: comment_meta
              env:
                  PREVIEW_THEME_NAME: ${{ steps.theme_name.outputs.name }}
              run: |
                  set -euo pipefail
                  TS="$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
                  echo "sync_at=${TS}" >> "$GITHUB_OUTPUT"
                  echo "preview_theme_name=${PREVIEW_THEME_NAME}" >> "$GITHUB_OUTPUT"

            - name: Build preview comment body
              id: preview_comment
              run: |
                  set -euo pipefail

                  PREVIEW_URL="${{ steps.push.outputs.preview_url }}"
                  PREVIEW_THEME_ID_RAW="${{ steps.finaltheme.outputs.theme_id }}"
                  BASE_THEME_ID_RAW="${{ steps.source.outputs.source_theme_id }}"
                  SOURCE_HOST="${{ steps.source.outputs.source_store_host }}"
                  STORE_SLUG="${{ steps.source.outputs.source_store_slug }}"
                  PREVIEW_THEME_NAME="${{ steps.comment_meta.outputs.preview_theme_name }}"
                  SYNC_AT="${{ steps.comment_meta.outputs.sync_at }}"
                  MARKER="${PREVIEW_MARKER:-iamota-shopify-preview}"

                  PREVIEW_THEME_ID="$(printf '%s' "${PREVIEW_THEME_ID_RAW}" | tr -cd '0-9')"
                  BASE_THEME_ID="$(printf '%s' "${BASE_THEME_ID_RAW}" | tr -cd '0-9')"

                  if [ -z "${PREVIEW_THEME_ID}" ] && [ -n "${PREVIEW_URL}" ]; then
                      PREVIEW_THEME_ID="$(echo "${PREVIEW_URL}" | sed -n 's/.*[?&]preview_theme_id=\([0-9][0-9]*\).*/\1/p')"
                  fi

                  [ -n "${PREVIEW_THEME_ID}" ] || PREVIEW_THEME_ID="UNKNOWN_PREVIEW_THEME_ID"
                  [ -n "${BASE_THEME_ID}" ] || BASE_THEME_ID="UNKNOWN_BASE_THEME_ID"
                  [ -n "${PREVIEW_THEME_NAME}" ] || PREVIEW_THEME_NAME="Preview Theme"
                  [ -n "${SYNC_AT}" ] || SYNC_AT="unknown-time"
                  [ -n "${PREVIEW_URL}" ] || PREVIEW_URL="#"
                  SOURCE_HOST="${SOURCE_HOST#https://}"
                  SOURCE_HOST="${SOURCE_HOST#http://}"
                  SOURCE_HOST="${SOURCE_HOST%%/*}"
                  [ -n "${SOURCE_HOST}" ] || SOURCE_HOST="unknown-store.myshopify.com"

                  STORE_SLUG="${STORE_SLUG#https://}"
                  STORE_SLUG="${STORE_SLUG#http://}"
                  STORE_SLUG="${STORE_SLUG%%/*}"
                  if [ -z "${STORE_SLUG}" ]; then
                      STORE_SLUG="${SOURCE_HOST}"
                  fi
                  STORE_SLUG="${STORE_SLUG%.myshopify.com}"
                  if echo "${STORE_SLUG}" | grep -q '\.'; then
                      STORE_SLUG="${STORE_SLUG%%.*}"
                  fi
                  [ -n "${STORE_SLUG}" ] || STORE_SLUG="unknown-store"

                  BASE_URL=""
                  if [ -n "${SOURCE_HOST}" ] && [ "${BASE_THEME_ID}" != "UNKNOWN_BASE_THEME_ID" ]; then
                      BASE_URL="https://${SOURCE_HOST}?preview_theme_id=${BASE_THEME_ID}"
                  fi

                  STORE_ADMIN_URL="https://admin.shopify.com/store/${STORE_SLUG}"
                  PREVIEW_CUSTOMIZER_URL="https://admin.shopify.com/store/${STORE_SLUG}/themes/${PREVIEW_THEME_ID}/editor"
                  PREVIEW_EDIT_CODE_URL="https://admin.shopify.com/store/${STORE_SLUG}/themes/${PREVIEW_THEME_ID}"
                  if [ -n "${BASE_URL}" ]; then
                      BASE_THEME_REF="[base theme](${BASE_URL}) (${BASE_THEME_ID})"
                  else
                      BASE_THEME_REF="base theme (${BASE_THEME_ID})"
                  fi

                  BODY="$(printf '%s\n' \
                    "<!-- ${MARKER}:theme_id=${PREVIEW_THEME_ID} -->" \
                    "" \
                    "## 🏠 Store: **[${STORE_SLUG}](${STORE_ADMIN_URL})**" \
                    "" \
                    "**[${PREVIEW_THEME_NAME}](${PREVIEW_URL})** (${PREVIEW_THEME_ID}) - [[Preview](${PREVIEW_URL}) | [Customizer](${PREVIEW_CUSTOMIZER_URL}) | [Edit Code](${PREVIEW_EDIT_CODE_URL})]" \
                    "" \
                    "<sub>Generated a Shopify preview theme on [${SOURCE_HOST}](https://${SOURCE_HOST}/admin) using the latest JSON content from ${BASE_THEME_REF} @ ${SYNC_AT}</sub>" \
                  )"

                  {
                    echo "body<<EOF"
                    printf '%s\n' "${BODY}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Write preview summary payload
              env:
                  RESULT_MARKER: ${{ env.PREVIEW_MARKER }}
                  RESULT_STORE_SLUG: ${{ steps.source.outputs.source_store_slug }}
                  RESULT_STORE_HOST: ${{ steps.source.outputs.source_store_host }}
                  RESULT_PREVIEW_THEME_NAME: ${{ steps.comment_meta.outputs.preview_theme_name }}
                  RESULT_PREVIEW_THEME_ID: ${{ steps.finaltheme.outputs.theme_id }}
                  RESULT_PREVIEW_URL: ${{ steps.push.outputs.preview_url }}
                  RESULT_BASE_THEME_ID: ${{ steps.source.outputs.source_theme_id }}
                  RESULT_SYNC_AT: ${{ steps.comment_meta.outputs.sync_at }}
              run: |
                  set -euo pipefail
                  mkdir -p preview-summary
                  node - <<'NODE'
                  const fs = require("node:fs");

                  const payload = {
                    marker: process.env.RESULT_MARKER || "",
                    store_slug: process.env.RESULT_STORE_SLUG || "",
                    store_host: process.env.RESULT_STORE_HOST || "",
                    preview_theme_name: process.env.RESULT_PREVIEW_THEME_NAME || "",
                    preview_theme_id: process.env.RESULT_PREVIEW_THEME_ID || "",
                    preview_url: process.env.RESULT_PREVIEW_URL || "",
                    base_theme_id: process.env.RESULT_BASE_THEME_ID || "",
                    sync_at: process.env.RESULT_SYNC_AT || "",
                  };

                  fs.writeFileSync(
                    `preview-summary/${process.env.TARGET_STORE_SLUG}.json`,
                    `${JSON.stringify(payload, null, 2)}\n`
                  );
                  NODE

            - name: Upload preview summary payload
              uses: actions/upload-artifact@v7
              with:
                  name: shopify-preview-summary-${{ env.TARGET_STORE_SLUG }}
                  path: preview-summary/${{ env.TARGET_STORE_SLUG }}.json
                  if-no-files-found: error

    shopify_theme_preview_summary:
        needs: [context, resolve_targets, shopify_theme_preview]
        if: needs.context.outputs.action == 'preview' && needs.resolve_targets.outputs.skip_preview != 'true' && needs.shopify_theme_preview.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout helper scripts
              id: helper_checkout
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@test/preview-on-demand
              with:
                  token: ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Download preview summary payloads
              uses: actions/download-artifact@v8
              with:
                  pattern: shopify-preview-summary-*
                  path: preview-summary
                  merge-multiple: true

            - name: Build preview summary comment body
              id: summary_comment
              shell: bash
              env:
                  HEAD_SHA: ${{ needs.context.outputs.head_sha }}
                  PREVIEW_MODE: ${{ needs.context.outputs.mode }}
                  PREVIEW_COMMAND: ${{ inputs.preview_command }}
              run: |
                  set -euo pipefail
                  node - <<'NODE' > preview-summary/body.md
                  const fs = require("node:fs");
                  const path = require("node:path");

                  const dir = path.join(process.cwd(), "preview-summary");
                  const files = fs.readdirSync(dir).filter((name) => name.endsWith(".json")).sort();
                  const rows = files.map((name) => JSON.parse(fs.readFileSync(path.join(dir, name), "utf8")));

                  const lines = [];
                  lines.push("<!-- iamota-shopify-preview-summary -->");
                  for (const row of rows) {
                    lines.push(`<!-- ${row.marker}:theme_id=${String(row.preview_theme_id || "").replace(/\D/g, "")} -->`);
                  }
                  lines.push("");
                  lines.push("# Preview Themes");
                  lines.push("");

                  for (const row of rows) {
                    const storeHost = String(row.store_host || "").replace(/^https?:\/\//i, "").replace(/\/$/, "");
                    const storeSlug = String(row.store_slug || "").replace(/^https?:\/\//i, "").replace(/\/$/, "");
                    const previewThemeId = String(row.preview_theme_id || "").replace(/\D/g, "") || "UNKNOWN_PREVIEW_THEME_ID";
                    const baseThemeId = String(row.base_theme_id || "").replace(/\D/g, "") || "UNKNOWN_BASE_THEME_ID";
                    const previewThemeName = row.preview_theme_name || "Preview Theme";
                    const previewUrl = row.preview_url || "#";
                    const syncAt = row.sync_at || "unknown-time";
                    const adminStoreSlug = storeSlug.includes(".") ? storeSlug.split(".")[0] : storeSlug;
                    const customizerUrl = `https://admin.shopify.com/store/${adminStoreSlug}/themes/${previewThemeId}/editor`;
                    const editCodeUrl = `https://admin.shopify.com/store/${adminStoreSlug}/themes/${previewThemeId}`;
                    const baseUrl = storeHost && baseThemeId !== "UNKNOWN_BASE_THEME_ID"
                      ? `https://${storeHost}?preview_theme_id=${baseThemeId}`
                      : "";
                    const baseThemeRef = baseUrl ? `[base theme](${baseUrl}) (${baseThemeId})` : `base theme (${baseThemeId})`;

                    lines.push(`- **[${storeSlug}](${previewUrl})** (${previewThemeId}) - [[Preview](${previewUrl}) | [Customizer](${customizerUrl}) | [Edit Code](${editCodeUrl})]`);
                    lines.push(`  <sub>Generated Shopify preview theme **[${previewThemeName}](${previewUrl})** on [${storeHost}](https://${storeHost}/admin) using the latest JSON content from ${baseThemeRef} @ ${syncAt}</sub>`);
                    lines.push("");
                  }

                  const sha = String(process.env.HEAD_SHA || "").slice(0, 7);
                  const cmd = process.env.PREVIEW_COMMAND || "/preview";
                  const notes = [];
                  if (sha) notes.push(`Built from ${sha}.`);
                  if (process.env.PREVIEW_MODE === "on_demand") {
                    notes.push(`Previews don't update on push: comment \`${cmd}\` to update them, \`${cmd} fresh\` to rebuild from the live theme, or \`${cmd} stop\` to delete them.`);
                  }
                  if (notes.length) lines.push(`<sub>${notes.join(" ")}</sub>`);

                  process.stdout.write(lines.join("\n"));
                  NODE
                  {
                    echo "body<<EOF"
                    cat preview-summary/body.md
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Sync preview summary PR comment marker
              env:
                  GH_TOKEN: ${{ github.token }}
              uses: iamota/iamota-github-actions/.github/actions/github-pr-comment-marker-set@test/preview-on-demand
              with:
                  repo: ${{ github.repository }}
                  pr: ${{ needs.context.outputs.pr_number }}
                  marker: iamota-shopify-preview-summary
                  body: ${{ steps.summary_comment.outputs.body }}
                  refresh_after_comments: "75"

    shopify_theme_preview_cleanup:
        needs: [context, resolve_targets]
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.resolve_targets.outputs.matrix_json) }}
        if: needs.context.outputs.action == 'cleanup' && needs.resolve_targets.outputs.skip_preview != 'true'
        runs-on: ubuntu-latest
        env:
            TARGET_STORE                          : ${{ matrix.store }}
            TARGET_STORE_SLUG                     : ${{ matrix.store_slug }}
            TARGET_STORE_INDEX                    : ${{ matrix.store_index }}
            TARGET_STORE_SECRET_KEY               : ${{ matrix.store_secret_key }}
            RAW_IAMOTA_ACTIONS_READ_TOKEN         : ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
            RAW_IAMOTA_ACTIONS_READ_TOKEN_NAMED   : ${{ secrets[format('IAMOTA_ACTIONS_READ_TOKEN__{0}', matrix.store_secret_key)] }}
            RAW_IAMOTA_ACTIONS_READ_TOKEN_INDEXED : ${{ secrets[format('IAMOTA_ACTIONS_READ_TOKEN_{0}', matrix.store_index)] }}
            RAW_SHOPIFY_THEME_ACCESS_TOKEN        : ${{ secrets.SHOPIFY_THEME_ACCESS_TOKEN }}
            RAW_SHOPIFY_THEME_ACCESS_TOKEN_NAMED  : ${{ secrets[format('SHOPIFY_THEME_ACCESS_TOKEN__{0}', matrix.store_secret_key)] }}
            RAW_SHOPIFY_THEME_ACCESS_TOKEN_INDEXED: ${{ secrets[format('SHOPIFY_THEME_ACCESS_TOKEN_{0}', matrix.store_index)] }}
            SHOPIFY_CLI_TTY                       : "0"

        steps:
            - name: Resolve effective Shopify token
              id: resolve_theme_token
              uses: iamota/iamota-github-actions/.github/actions/multistore-resolve-secret@test/preview-on-demand
              with:
                  store: ${{ env.TARGET_STORE }}
                  raw: ${{ env.RAW_SHOPIFY_THEME_ACCESS_TOKEN }}
                  raw_named: ${{ env.RAW_SHOPIFY_THEME_ACCESS_TOKEN_NAMED }}
                  raw_indexed: ${{ env.RAW_SHOPIFY_THEME_ACCESS_TOKEN_INDEXED }}

            - name: Export cleanup resolved values
              run: |
                  set -euo pipefail
                  {
                    echo "SHOPIFY_STORE=${TARGET_STORE}"
                    echo "SHOPIFY_THEME_ACCESS_TOKEN=${{ steps.resolve_theme_token.outputs.value }}"
                    echo "PREVIEW_MARKER=iamota-shopify-preview-${TARGET_STORE_SLUG}"
                  } >> "$GITHUB_ENV"

            - name: Validate resolved cleanup values
              run: |
                  set -euo pipefail
                  MISSING=()
                  [ -n "${SHOPIFY_STORE:-}" ] || MISSING+=("SHOPIFY_STORE input/var")
                  [ -n "${SHOPIFY_THEME_ACCESS_TOKEN:-}" ] || MISSING+=("SHOPIFY_THEME_ACCESS_TOKEN secret")
                  if [ "${#MISSING[@]}" -gt 0 ]; then
                      echo "Missing required Shopify values: ${MISSING[*]}"
                      exit 1
                  fi

            - name: Setup Node + Install Shopify CLI
              uses: iamota/iamota-github-actions/.github/actions/shopify-cli-install@test/preview-on-demand
              with:
                  cli_version: ${{ vars.SHOPIFY_CLI_VERSION }}

            - name: Checkout helper scripts
              id: helper_checkout
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@test/preview-on-demand
              with:
                  token: ${{ env.RAW_IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Verify helper checkout
              run: |
                  set -euo pipefail
                  echo "Helper checkout ref: ${{ steps.helper_checkout.outputs.ref }}"
                  echo "Workspace: ${GITHUB_WORKSPACE}"
                  if [ -d "${GITHUB_WORKSPACE}/.iamota-actions" ]; then
                      git -C "${GITHUB_WORKSPACE}/.iamota-actions" rev-parse HEAD || true
                      find "${GITHUB_WORKSPACE}/.iamota-actions/.github/scripts" -maxdepth 3 -type f | sort || true
                  else
                      echo ".iamota-actions directory is missing after helper checkout."
                      ls -la "${GITHUB_WORKSPACE}" || true
                      exit 1
                  fi

            - name: Find preview theme id from marker
              id: marker
              env:
                  GH_TOKEN: ${{ github.token }}
              uses: iamota/iamota-github-actions/.github/actions/github-pr-comment-marker-get@test/preview-on-demand
              with:
                  repo         : ${{ github.repository }}
                  pr           : ${{ needs.context.outputs.pr_number }}
                  marker       : ${{ env.PREVIEW_MARKER }}
                  extract_regex: theme_id=(\d+)

            - name: Normalize marker theme id
              id: marker_norm
              run: |
                  set -euo pipefail
                  RAW_ID="${{ steps.marker.outputs.extracted_value }}"
                  THEME_ID="$(printf '%s' "${RAW_ID}" | tr -cd '0-9')"
                  echo "theme_id=${THEME_ID}" >> "$GITHUB_OUTPUT"

            - name: Delete preview theme (if exists)
              id: delete_preview
              if: steps.marker_norm.outputs.theme_id != ''
              uses: iamota/iamota-github-actions/.github/actions/shopify-theme-delete@test/preview-on-demand
              with:
                  store           : ${{ env.SHOPIFY_STORE }}
                  theme_id        : ${{ steps.marker_norm.outputs.theme_id }}
                  token           : ${{ env.SHOPIFY_THEME_ACCESS_TOKEN }}
                  ignore_not_found: "true"

            - name: Write cleanup result payload
              env:
                  THEME_ID: ${{ steps.marker_norm.outputs.theme_id }}
                  DELETE_STATUS: ${{ steps.delete_preview.outputs.status }}
              run: |
                  set -euo pipefail
                  mkdir -p preview-cleanup
                  node -e '
                  const fs = require("node:fs");
                  const payload = {
                    marker: process.env.PREVIEW_MARKER || "",
                    store_host: process.env.SHOPIFY_STORE || "",
                    store_slug: process.env.TARGET_STORE_SLUG || "",
                    theme_id: process.env.THEME_ID || "",
                    status: process.env.THEME_ID ? (process.env.DELETE_STATUS || "unknown") : "none",
                  };
                  fs.writeFileSync(`preview-cleanup/${process.env.TARGET_STORE_SLUG}.json`, JSON.stringify(payload, null, 2) + "\n");
                  '

            - name: Upload cleanup result payload
              uses: actions/upload-artifact@v7
              with:
                  name: shopify-preview-cleanup-${{ env.TARGET_STORE_SLUG }}
                  path: preview-cleanup/${{ env.TARGET_STORE_SLUG }}.json
                  if-no-files-found: error

    # Rewrites the summary comment in place: per-store markers are emptied so a
    # later /preview (or reopen in auto mode) creates new themes.
    shopify_theme_preview_cleanup_summary:
        needs: [context, resolve_targets, shopify_theme_preview_cleanup]
        if: always() && needs.context.outputs.action == 'cleanup' && needs.shopify_theme_preview_cleanup.result != 'skipped'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout helper scripts
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@test/preview-on-demand
              with:
                  token: ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Download cleanup result payloads
              uses: actions/download-artifact@v8
              with:
                  pattern: shopify-preview-cleanup-*
                  path: preview-cleanup
                  merge-multiple: true

            - name: Build cleanup summary comment body
              id: cleanup_comment
              env:
                  REASON: ${{ needs.context.outputs.reason }}
                  CLEANUP_RESULT: ${{ needs.shopify_theme_preview_cleanup.result }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  mkdir -p preview-cleanup
                  node - <<'NODE' > preview-cleanup/body.md
                  const fs = require("node:fs");
                  const path = require("node:path");
                  const dir = path.join(process.cwd(), "preview-cleanup");
                  const rows = fs.readdirSync(dir).filter((n) => n.endsWith(".json")).sort()
                    .map((n) => JSON.parse(fs.readFileSync(path.join(dir, n), "utf8")));
                  const why = process.env.REASON === "PR closed" ? "the PR was closed" : "of a stop request";
                  const lines = ["<!-- iamota-shopify-preview-summary -->"];
                  for (const row of rows) lines.push(`<!-- ${row.marker}:theme_id= -->`);
                  lines.push("", "# Preview Themes", "", `Preview themes were deleted because ${why}.`, "");
                  const label = { deleted: "deleted", missing: "already gone", none: "nothing to delete" };
                  for (const row of rows) {
                    const theme = row.theme_id ? `theme ${row.theme_id}` : "no preview theme";
                    lines.push(`- **${row.store_slug || row.store_host}**: ${theme}, ${label[row.status] || row.status}`);
                  }
                  if (process.env.CLEANUP_RESULT !== "success") {
                    lines.push("", `Some stores failed to clean up; see [the run](${process.env.RUN_URL}).`);
                  }
                  process.stdout.write(lines.join("\n") + "\n");
                  NODE
                  {
                    echo "body<<EOF"
                    cat preview-cleanup/body.md
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Sync preview summary PR comment marker
              env:
                  GH_TOKEN: ${{ github.token }}
              uses: iamota/iamota-github-actions/.github/actions/github-pr-comment-marker-set@test/preview-on-demand
              with:
                  repo: ${{ github.repository }}
                  pr: ${{ needs.context.outputs.pr_number }}
                  marker: iamota-shopify-preview-summary
                  body: ${{ steps.cleanup_comment.outputs.body }}
                  refresh_after_comments: "75"

    # How to request previews: posted once when a PR opens in on_demand mode,
    # and as a reply to "/preview help".
    shopify_theme_preview_help:
        needs: [context, resolve_targets]
        if: needs.context.outputs.action == 'help' && needs.resolve_targets.outputs.skip_preview != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout helper scripts
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@test/preview-on-demand
              with:
                  token: ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Build help comment body
              id: help_comment
              env:
                  MATRIX_JSON: ${{ needs.resolve_targets.outputs.matrix_json }}
                  PREVIEW_COMMAND: ${{ inputs.preview_command }}
                  PREVIEW_MODE: ${{ needs.context.outputs.mode }}
                  REASON: ${{ needs.context.outputs.reason }}
              run: |
                  set -euo pipefail
                  node - <<'NODE' > help.md
                  const matrix = JSON.parse(process.env.MATRIX_JSON || "{}");
                  const stores = (matrix.include || []).map((m) => m.store_slug || m.store).filter(Boolean);
                  const cmd = process.env.PREVIEW_COMMAND || "/preview";
                  const reason = process.env.REASON || "";
                  const lines = ["<!-- iamota-shopify-preview-help -->", "", "### Shopify preview themes", ""];
                  if (reason.startsWith("unknown option")) lines.push(`I didn't recognise that: ${reason}.`, "");
                  lines.push(
                    stores.length
                      ? `Comment \`${cmd}\` to build preview themes for this PR on ${stores.map((s) => `**${s}**`).join(", ")}.`
                      : `Comment \`${cmd}\` to build preview themes for this PR.`,
                    "",
                    `- \`${cmd}\`: build the previews, or update them with the latest commit`,
                    `- \`${cmd} fresh\`: delete and rebuild them from the current live theme (new theme IDs and links)`,
                    `- \`${cmd} stop\`: delete them`,
                    "",
                    process.env.PREVIEW_MODE === "on_demand"
                      ? "Previews don't update on push, so comment again after new commits. They're deleted when the PR closes."
                      : "Previews also update on every push, and are deleted when the PR closes.",
                  );
                  process.stdout.write(lines.join("\n") + "\n");
                  NODE
                  {
                    echo "body<<EOF"
                    cat help.md
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Post help comment (PR opened)
              if: needs.context.outputs.comment_id == ''
              env:
                  GH_TOKEN: ${{ github.token }}
              uses: iamota/iamota-github-actions/.github/actions/github-pr-comment-marker-set@test/preview-on-demand
              with:
                  repo: ${{ github.repository }}
                  pr: ${{ needs.context.outputs.pr_number }}
                  marker: iamota-shopify-preview-help
                  body: ${{ steps.help_comment.outputs.body }}

            - name: Reply with help comment
              if: needs.context.outputs.comment_id != ''
              env:
                  GH_TOKEN: ${{ github.token }}
              uses: iamota/iamota-github-actions/.github/actions/github-pr-comment-add@test/preview-on-demand
              with:
                  repo: ${{ github.repository }}
                  pr: ${{ needs.context.outputs.pr_number }}
                  body: ${{ steps.help_comment.outputs.body }}

    # Reacts to the /preview comment with the outcome: rocket on success,
    # confused plus a link to the run on failure.
    shopify_theme_preview_command_result:
        needs: [context, shopify_theme_preview, shopify_theme_preview_summary, shopify_theme_preview_cleanup, shopify_theme_preview_cleanup_summary]
        if: always() && needs.context.outputs.comment_id != '' && (needs.context.outputs.action == 'preview' || needs.context.outputs.action == 'cleanup')
        runs-on: ubuntu-latest
        steps:
            - name: Report result on the command comment
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMMENT_ID: ${{ needs.context.outputs.comment_id }}
                  PR_NUMBER: ${{ needs.context.outputs.pr_number }}
                  ACTION: ${{ needs.context.outputs.action }}
                  RESULTS: ${{ toJSON(needs) }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  FAILED="$(node -e '
                  const needs = JSON.parse(process.env.RESULTS || "{}");
                  const jobs = process.env.ACTION === "cleanup"
                    ? ["shopify_theme_preview_cleanup", "shopify_theme_preview_cleanup_summary"]
                    : ["shopify_theme_preview", "shopify_theme_preview_summary"];
                  const results = jobs.map((j) => (needs[j] && needs[j].result) || "skipped");
                  process.stdout.write(results.every((r) => r === "skipped") ? "skipped" : results.some((r) => r !== "success") ? "true" : "false");
                  ')"
                  if [ "${FAILED}" = "skipped" ]; then
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=confused --silent || true
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="Previews aren't built for this PR's branch (see \`non_preview_branches\`)." --silent
                      exit 0
                  fi
                  if [ "${FAILED}" = "true" ]; then
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=confused --silent || true
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                          -f body="The \`${ACTION}\` request didn't finish. See [the run](${RUN_URL})." --silent
                      exit 0
                  fi
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=rocket --silent
