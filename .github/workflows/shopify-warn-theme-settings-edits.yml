name: Shopify Theme Settings Edit Guard

on:
    workflow_call:
        inputs:
            ack_label:
                type: string
                required: false
                default: "I will manually deploy theme settings"
        # Pass explicitly (`secrets: IAMOTA_ACTIONS_READ_TOKEN: ...`), never `secrets: inherit`.
        secrets:
            IAMOTA_ACTIONS_READ_TOKEN:
                required: false

permissions: {}

jobs:
    settings-guard:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write

        steps:
            - name: Checkout helper scripts
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@v1
              with:
                  token: ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  # Node baseline — keep in sync with docs/github-actions/node-version.md.
                  node-version: "24"

            - name: Run theme settings guard
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  node .iamota-actions/.github/scripts/github/github-pr-guard-shopify-theme-settings.mjs \
                      --repo "${{ github.repository }}" \
                      --pr "${{ github.event.pull_request.number }}" \
                      --event-action "${{ github.event.action }}" \
                      --before "${{ github.event.before || '' }}" \
                      --after "${{ github.event.pull_request.head.sha }}" \
                      --ack-label "${{ inputs.ack_label }}"
