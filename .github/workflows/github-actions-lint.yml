name: Workflow Sanity

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            actionlint_mode:
                description: >-
                    actionlint mode: "true" (gate on findings at/above
                    actionlint_fail_level), "log" (never fail; just report), or
                    "false" (skip the job entirely).
                type: choice
                options: ["true", "log", "false"]
                default: "true"
            actionlint_fail_level:
                description: >-
                    Lowest severity that fails the build when mode is "true".
                    One of: error, warning, info, style. Findings below this
                    level are still reported but never gate.
                type: choice
                options: ["error", "warning", "info", "style"]
                default: "error"

permissions:
    contents: read
    pull-requests: write
    issues: write

# Pin once so the installer download and the lint run stay in lockstep.
env:
    ACTIONLINT_VERSION: "1.7.12"

jobs:
    actionlint:
        # Resolve effective config: workflow_dispatch input > repo variable >
        # default. Defaults gate only on errors and log everything else.
        if: >-
            (github.event.inputs.actionlint_mode || vars.ACTIONLINT_MODE || 'true') != 'false'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # actionlint ships as a Go CLI, not a composite action, so there is
            # no `uses:` form. Pull a pinned release via the official installer.
            - name: Download actionlint
              id: install
              run: |
                  set -euo pipefail
                  mkdir -p "${RUNNER_TEMP}/actionlint"
                  bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
                      "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}/actionlint"
                  echo "bin=${RUNNER_TEMP}/actionlint/actionlint" >> "$GITHUB_OUTPUT"
              shell: bash

            - name: Run actionlint (JSON)
              id: run
              env:
                  ACTIONLINT_BIN: ${{ steps.install.outputs.bin }}
              run: |
                  set -euo pipefail
                  mkdir -p _ci_reports
                  JSON_OUT="_ci_reports/actionlint.json"

                  set +e
                  "${ACTIONLINT_BIN}" -format '{{json .}}' > "${JSON_OUT}" 2>"_ci_reports/actionlint.stderr.log"
                  EXIT_CODE=$?
                  set -e

                  # actionlint exits non-zero whenever it finds ANY issue. We do
                  # not gate on the exit code (gating is severity-driven below);
                  # we only treat it as fatal if no JSON was produced, which
                  # means actionlint itself failed to run.
                  if [ ! -s "${JSON_OUT}" ]; then
                      echo "actionlint produced no JSON output (exit ${EXIT_CODE}); treating as a hard failure."
                      cat "_ci_reports/actionlint.stderr.log" || true
                      echo "json_path=${JSON_OUT}" >> "$GITHUB_OUTPUT"
                      echo "hard_error=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "json_path=${JSON_OUT}" >> "$GITHUB_OUTPUT"
                  echo "hard_error=false" >> "$GITHUB_OUTPUT"
                  echo "actionlint exit code: ${EXIT_CODE}"
              shell: bash

            - name: Build actionlint report
              id: report
              env:
                  JSON_PATH: ${{ steps.run.outputs.json_path }}
                  HARD_ERROR: ${{ steps.run.outputs.hard_error }}
                  ACTIONLINT_MODE: ${{ github.event.inputs.actionlint_mode || vars.ACTIONLINT_MODE || 'true' }}
                  ACTIONLINT_FAIL_LEVEL: ${{ github.event.inputs.actionlint_fail_level || vars.ACTIONLINT_FAIL_LEVEL || 'error' }}
                  GITHUB_SERVER_URL: ${{ github.server_url }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  FILE_LINK_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require("node:fs");

                  const jsonPath = process.env.JSON_PATH;
                  const hardError = String(process.env.HARD_ERROR || "false") === "true";
                  const mode = String(process.env.ACTIONLINT_MODE || "true").toLowerCase();
                  const failLevel = String(process.env.ACTIONLINT_FAIL_LEVEL || "error").toLowerCase();
                  const summaryPath = process.env.GITHUB_STEP_SUMMARY || "";
                  const outputPath = process.env.GITHUB_OUTPUT;
                  const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
                  const repo = process.env.GITHUB_REPOSITORY || "";
                  const runUrl = `${serverUrl}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID || ""}`;
                  const fileLinkRef = process.env.FILE_LINK_REF || "";

                  // shellcheck has four severities; actionlint's own findings
                  // (syntax, expression, glob, etc.) have none, so we treat them
                  // as errors. Higher number = more severe.
                  const sevRank = { error: 4, warning: 3, info: 2, style: 1 };
                  const threshold = Object.prototype.hasOwnProperty.call(sevRank, failLevel) ? sevRank[failLevel] : 4;

                  function appendOutput(name, value) {
                      fs.appendFileSync(outputPath, `${name}<<EOF\n${value}\nEOF\n`);
                  }

                  // shellcheck messages embed the code + severity, e.g.
                  // "shellcheck reported issue in this script: SC2129:style:10:1: ...".
                  function deriveSeverity(finding) {
                      if (String(finding.kind || "") === "shellcheck") {
                          const m = /SC\d+:(error|warning|info|style)\b/i.exec(String(finding.message || ""));
                          if (m) return m[1].toLowerCase();
                          return "warning";
                      }
                      return "error";
                  }

                  function fileUrl(filePath, line) {
                      if (!fileLinkRef || !filePath) return "";
                      const lineAnchor = Number(line) > 0 ? `#L${Number(line)}` : "";
                      return `${serverUrl}/${repo}/blob/${fileLinkRef}/${filePath}${lineAnchor}`;
                  }

                  function severityEmoji(severity) {
                      if (severity === "error") return '<span title="Error">❌</span>';
                      if (severity === "warning") return '<span title="Warning">⚠️</span>';
                      if (severity === "info") return '<span title="Info">ℹ️</span>';
                      return '<span title="Style">🎨</span>';
                  }

                  function findingLine(f) {
                      const loc = f.line > 0 ? `:${f.line}${f.column > 0 ? `:${f.column}` : ""}` : "";
                      const label = `${f.filePath}${loc}`;
                      const url = fileUrl(f.filePath, f.line);
                      const linked = url ? `[\`${label}\`](${url})` : `\`${label}\``;
                      return `- ${severityEmoji(f.severity)} ${linked} \`${f.kind}\` - ${f.message}`;
                  }

                  let raw = fs.existsSync(jsonPath) ? fs.readFileSync(jsonPath, "utf8").trim() : "";
                  let parsed = [];
                  if (raw) {
                      try { parsed = JSON.parse(raw); } catch { parsed = []; }
                  }
                  if (!Array.isArray(parsed)) parsed = [];

                  const findings = parsed.map((entry) => {
                      const message = String(entry?.message || "").replace(/\s+/g, " ").trim();
                      const kind = String(entry?.kind || "actionlint");
                      const severity = deriveSeverity({ kind, message });
                      return {
                          filePath: String(entry?.filepath || "").replace(/\\/g, "/"),
                          line: Number(entry?.line || 0),
                          column: Number(entry?.column || 0),
                          kind,
                          message,
                          severity,
                      };
                  });

                  const counts = { error: 0, warning: 0, info: 0, style: 0 };
                  for (const f of findings) {
                      if (Object.prototype.hasOwnProperty.call(counts, f.severity)) counts[f.severity] += 1;
                  }

                  const sortFindings = (a, b) =>
                      (sevRank[b.severity] ?? 0) - (sevRank[a.severity] ?? 0) ||
                      a.filePath.localeCompare(b.filePath) ||
                      a.line - b.line ||
                      a.column - b.column;

                  const matched = findings.filter((f) => (sevRank[f.severity] ?? 0) >= threshold).sort(sortFindings);
                  const below = findings.filter((f) => (sevRank[f.severity] ?? 0) < threshold).sort(sortFindings);

                  const shouldFail = hardError || (mode === "true" && matched.length > 0);

                  const countSummary = `actionlint found \`${counts.error}\` errors, \`${counts.warning}\` warnings, \`${counts.info}\` info, \`${counts.style}\` style. [Full Logs](${runUrl})`;

                  // ---- PR comment (gating findings first, then the rest) ----
                  const commentLines = ["<!-- iamota-actionlint -->", "## Workflow Lint (actionlint)", "", countSummary];
                  if (hardError) {
                      commentLines.push("", "> ❌ actionlint failed to run — see the job logs.");
                  }
                  const commentGroups = [
                      { title: `Findings at or above \`${failLevel}\` (gating)`, items: matched },
                      { title: "Lower-severity findings (informational)", items: below },
                  ];
                  for (const group of commentGroups) {
                      if (group.items.length === 0) continue;
                      commentLines.push("", "<details>", `<summary>${group.title} (${Math.min(group.items.length, 50)} shown of ${group.items.length})</summary>`, "");
                      for (const f of group.items.slice(0, 50)) commentLines.push(findingLine(f));
                      if (group.items.length > 50) commentLines.push("", `_Additional findings omitted: ${group.items.length - 50}_`);
                      commentLines.push("", "</details>");
                  }
                  if (findings.length === 0 && !hardError) {
                      commentLines.push("", "✅ No issues found.");
                  }

                  // ---- Step summary (all findings grouped by severity) ----
                  const summaryLines = ["## Workflow Lint (actionlint)", "", countSummary];
                  for (const sev of ["error", "warning", "info", "style"]) {
                      const items = findings.filter((f) => f.severity === sev).sort(sortFindings);
                      summaryLines.push("", "<details>", `<summary>${items.length} ${sev}</summary>`, "");
                      summaryLines.push(items.length ? items.map(findingLine).join("\n") : "None.");
                      summaryLines.push("", "</details>");
                  }
                  if (summaryPath) fs.appendFileSync(summaryPath, `${summaryLines.join("\n")}\n`);

                  const commentPath = "_ci_reports/actionlint-comment.md";
                  fs.writeFileSync(commentPath, `${commentLines.join("\n")}\n`);

                  appendOutput("comment_path", commentPath);
                  appendOutput("matched_count", String(matched.length));
                  appendOutput("all_count", String(findings.length));
                  appendOutput("should_fail", shouldFail ? "true" : "false");

                  console.log(countSummary.replace(/`/g, ""));
                  console.log(`mode=${mode} fail_level=${failLevel} gating=${matched.length} should_fail=${shouldFail}`);
                  NODE
              shell: bash

            - name: Sync actionlint PR comment
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v8
              env:
                  ACTIONLINT_COMMENT_PATH: ${{ steps.report.outputs.comment_path }}
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const fs = require('node:fs');

                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const issue_number = context.payload.pull_request.number;
                      const marker = '<!-- iamota-actionlint -->';
                      const body = fs.readFileSync(process.env.ACTIONLINT_COMMENT_PATH, 'utf8');

                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner,
                          repo,
                          issue_number,
                          per_page: 100,
                      });

                      const existing = comments
                          .filter((comment) => comment.user?.type === 'Bot' && String(comment.body || '').includes(marker))
                          .sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at))[0];

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                          core.info(`Updated actionlint PR comment ${existing.id}.`);
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                          core.info('Created actionlint PR comment.');
                      }

            - name: Fail actionlint job when configured
              if: steps.report.outputs.should_fail == 'true'
              run: |
                  echo "actionlint reported findings at or above the configured fail level (or failed to run)."
                  exit 1
              shell: bash

    node-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Validate node scripts
              run: |
                  set -euo pipefail
                  while IFS= read -r f; do
                      node --check "$f"
                  done < <(find .github/scripts -type f -name "*.mjs" | sort)
