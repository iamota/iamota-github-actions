name: Workflow Sanity

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    actionlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            # actionlint ships as a Go CLI, not a composite action, so there is
            # no `uses:` form. Pull a pinned release via the official installer.
            - name: Download actionlint
              id: actionlint
              run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
              shell: bash
            - name: Run actionlint
              run: ${{ steps.actionlint.outputs.executable }} -color
              shell: bash

    node-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Validate node scripts
              run: |
                  set -euo pipefail
                  while IFS= read -r f; do
                      node --check "$f"
                  done < <(find .github/scripts -type f -name "*.mjs" | sort)
