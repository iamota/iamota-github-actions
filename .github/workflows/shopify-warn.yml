name: Shopify Warn

# Combined Shopify PR guard. Supersedes shopify-warn-locale-edits.yml and
# shopify-warn-theme-settings-edits.yml: both guards share a single runner
# (one helper checkout + Node setup) instead of paying the per-job minute
# floor twice. Each guard can be toggled independently via its flag.

on:
    workflow_call:
        inputs:
            shopify_warn_locale_edits:
                description: 'Run the locale edit guard ("true"/"false").'
                type: string
                required: false
                default: "true"
            shopify_warn_theme_settings:
                description: 'Run the theme settings edit guard ("true"/"false").'
                type: string
                required: false
                default: "true"
            locale_ack_label:
                type: string
                required: false
                default: "I will manually deploy locales"
            theme_settings_ack_label:
                type: string
                required: false
                default: "I will manually deploy theme settings"
        secrets:
            IAMOTA_ACTIONS_READ_TOKEN:
                required: false

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    shopify-warn:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout helper scripts
              uses: iamota/iamota-github-actions/.github/actions/iamota-helper-checkout@v1
              with:
                  token: ${{ secrets.IAMOTA_ACTIONS_READ_TOKEN }}
                  path: .iamota-actions

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  # Node baseline — keep in sync with docs/github-actions/node-version.md.
                  node-version: "24"

            - name: Run locale guard
              if: ${{ inputs.shopify_warn_locale_edits != 'false' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  node .iamota-actions/.github/scripts/github/github-pr-guard-shopify-locale.mjs \
                      --repo "${{ github.repository }}" \
                      --pr "${{ github.event.pull_request.number }}" \
                      --event-action "${{ github.event.action }}" \
                      --before "${{ github.event.before || '' }}" \
                      --after "${{ github.event.pull_request.head.sha }}" \
                      --ack-label "${{ inputs.locale_ack_label }}"

            # Runs even if the locale guard failed, so a failure in one guard
            # never masks the other. The job still fails if either guard fails.
            - name: Run theme settings guard
              if: ${{ !cancelled() && inputs.shopify_warn_theme_settings != 'false' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  node .iamota-actions/.github/scripts/github/github-pr-guard-shopify-theme-settings.mjs \
                      --repo "${{ github.repository }}" \
                      --pr "${{ github.event.pull_request.number }}" \
                      --event-action "${{ github.event.action }}" \
                      --before "${{ github.event.before || '' }}" \
                      --after "${{ github.event.pull_request.head.sha }}" \
                      --ack-label "${{ inputs.theme_settings_ack_label }}"
