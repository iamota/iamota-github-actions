name: GitHub Packages NPM Publish (Canonical)

# Publishes a scoped npm package to GitHub Packages (npm.pkg.github.com) as a
# private, org-scoped package. Package visibility follows the source repository:
# a private repo yields a package only `iamota` org members can install, so no
# `--access` flag is involved.
#
# Auth is the run's own GITHUB_TOKEN — the caller must grant
# `permissions: { contents: read, packages: write }` on the calling job. That
# replaces the classic PAT with `write:packages` that the old per-repo publish
# workflows used.
#
# Two jobs, so the publish credential never meets the package's code:
#   build   — unprivileged (contents: read, packages: read). Checks out, installs
#             with `npm ci --ignore-scripts` (lockfile required), builds, tests,
#             then `npm pack --ignore-scripts` and uploads the tarball as an
#             artifact. Dependency and package scripts run only here.
#   publish — packages: write. No checkout and no install: it downloads the
#             tarball, checks its sha256 against the build job's, and runs
#             `npm publish <tarball> --ignore-scripts`. NODE_AUTH_TOKEN is set on
#             that one step only.
# Because nothing runs package scripts at publish time, lifecycle hooks such as
# `prepublishOnly` or `prepack` do NOT run: build with `run_build` (the
# package's `build` script) instead.
#
# Provenance: npm `--provenance` is only supported by registry.npmjs.org, not
# GitHub Packages, and GitHub artifact attestations for private repositories
# need GitHub Enterprise Cloud, so neither is enabled here. The tarball's
# sha256 is recorded in the run summary.
#
# Secrets: pass `NPM_PUBLISH_TOKEN` explicitly if you need it at all — never
# `secrets: inherit`.
#
# Typical trigger is a published GitHub Release; the version guard below keeps
# the release tag and package.json version from drifting apart.

on:
    workflow_call:
        inputs:
            scope:
                description: >-
                    npm scope the package must be published under. The job fails
                    when package.json `name` is not `<scope>/...`, so a misnamed
                    package can never resolve to the wrong registry.
                type: string
                required: false
                default: "@iamota"
            registry_url:
                description: "npm registry to publish to."
                type: string
                required: false
                default: "https://npm.pkg.github.com"
            working_directory:
                description: "Directory containing package.json."
                type: string
                required: false
                default: "."
            ref:
                description: >-
                    Git ref to check out and publish. Empty = the ref that
                    triggered the run. Set this when an upstream job created the
                    commit to publish (e.g. the release tag from
                    release-semver-tags), since the default checkout would
                    otherwise miss it.
                type: string
                required: false
                default: ""
            expected_version:
                description: >-
                    When set, require package.json `version` to equal this
                    (leading `v` optional). Use it to assert the version an
                    upstream job computed actually landed in the checkout.
                type: string
                required: false
                default: ""
            install_command:
                description: >-
                    Install command for the unprivileged build job. The default
                    needs a committed lockfile and runs no dependency scripts.
                    An override (e.g. `npm install`) is honoured for compatibility
                    but loses the lockfile pin and script blocking, and warns.
                type: string
                required: false
                default: "npm ci --ignore-scripts"
            node_version:
                type: string
                required: false
                # Node baseline — keep in sync with docs/github-actions/node-version.md.
                default: "24"
            run_test:
                description: "Run `npm test` before publishing (skipped when the package has no test script)."
                type: boolean
                required: false
                default: true
            run_build:
                description: "Run `npm run build` before publishing (skipped when the package has no build script)."
                type: boolean
                required: false
                default: false
            verify_version_matches_tag:
                description: >-
                    When the run is triggered by a release or tag, require
                    package.json `version` to equal the tag (leading `v`
                    optional). Non-tag triggers skip the check.
                type: boolean
                required: false
                default: true
            skip_if_published:
                description: >-
                    Exit successfully (instead of failing on the registry's 409)
                    when this name@version is already published.
                type: boolean
                required: false
                default: true
            dry_run:
                description: "Run `npm publish --dry-run` — packs and validates, publishes nothing."
                type: boolean
                required: false
                default: false
        secrets:
            NPM_PUBLISH_TOKEN:
                description: >-
                    Optional override token. Leave unset to publish with the
                    run's GITHUB_TOKEN (the normal case). Set only to publish to
                    a registry the run token cannot reach. Used only by the
                    publish step.
                required: false

permissions: {}

concurrency:
    group: iamota-github-npm-publish-${{ github.repository }}-${{ github.ref || github.run_id }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Lets the install read other private @iamota packages and lets
            # `npm view` see whether this version is already published.
            packages: read
        outputs:
            name: ${{ steps.pkg.outputs.name }}
            version: ${{ steps.pkg.outputs.version }}
            exists: ${{ steps.published.outputs.exists }}
            tarball: ${{ steps.pack.outputs.tarball }}
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  # Empty resolves to the triggering ref (checkout's own default).
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            - name: Setup Node for GitHub Packages
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node_version }}
                  registry-url: ${{ inputs.registry_url }}
                  scope: ${{ inputs.scope }}

            - name: Resolve package identity
              id: pkg
              working-directory: ${{ inputs.working_directory }}
              env:
                  EXPECTED_SCOPE: ${{ inputs.scope }}
                  REGISTRY_URL: ${{ inputs.registry_url }}
                  WORKING_DIRECTORY: ${{ inputs.working_directory }}
              run: |
                  set -euo pipefail
                  if [ ! -f package.json ]; then
                      echo "::error::No package.json in ${WORKING_DIRECTORY}; nothing to publish."
                      exit 1
                  fi
                  NAME="$(node -p "require('./package.json').name || ''")"
                  VERSION="$(node -p "require('./package.json').version || ''")"
                  if [ -z "${NAME}" ] || [ -z "${VERSION}" ]; then
                      echo "::error::package.json must declare both name and version."
                      exit 1
                  fi
                  case "${NAME}" in
                      "${EXPECTED_SCOPE}/"*) ;;
                      *)
                          echo "::error::Package name '${NAME}' is not under the expected scope '${EXPECTED_SCOPE}'; it would not resolve to ${REGISTRY_URL}."
                          exit 1
                          ;;
                  esac
                  {
                      echo "name=${NAME}"
                      echo "version=${VERSION}"
                  } >> "$GITHUB_OUTPUT"
                  echo "Publishing ${NAME}@${VERSION} to ${REGISTRY_URL}"

            - name: Verify version matches expected_version
              if: inputs.expected_version != ''
              env:
                  EXPECTED: ${{ inputs.expected_version }}
                  PKG_VERSION: ${{ steps.pkg.outputs.version }}
              run: |
                  set -euo pipefail
                  EXPECTED_VERSION="${EXPECTED#v}"
                  if [ "${EXPECTED_VERSION}" != "${PKG_VERSION}" ]; then
                      echo "::error::Expected version '${EXPECTED_VERSION}' but the checkout's package.json says '${PKG_VERSION}'. The wrong ref was published."
                      exit 1
                  fi
                  echo "Checkout is at expected version '${PKG_VERSION}'."

            - name: Verify version matches release tag
              if: inputs.verify_version_matches_tag && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/'))
              env:
                  TAG: ${{ github.event.release.tag_name || github.ref_name }}
                  PKG_VERSION: ${{ steps.pkg.outputs.version }}
              run: |
                  set -euo pipefail
                  TAG_VERSION="${TAG#v}"
                  if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
                      echo "::error::Release tag '${TAG}' does not match package.json version '${PKG_VERSION}'. Bump package.json (and its lockfile) before tagging."
                      exit 1
                  fi
                  echo "Tag '${TAG}' matches package version '${PKG_VERSION}'."

            - name: Check whether this version is already published
              id: published
              if: inputs.skip_if_published
              working-directory: ${{ inputs.working_directory }}
              env:
                  # Read-only: this job's GITHUB_TOKEN carries packages: read.
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PKG_NAME: ${{ steps.pkg.outputs.name }}
                  PKG_VERSION: ${{ steps.pkg.outputs.version }}
                  REGISTRY_URL: ${{ inputs.registry_url }}
              run: |
                  set -euo pipefail
                  # `npm view` exits non-zero for an unpublished name/version, which
                  # is the normal case on a first publish — not an error here.
                  if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry "${REGISTRY_URL}" >/dev/null 2>&1; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::${PKG_NAME}@${PKG_VERSION} is already published; publish will be skipped."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install npm dependencies
              if: steps.published.outputs.exists != 'true'
              working-directory: ${{ inputs.working_directory }}
              env:
                  # packages: read token, for private @iamota dependencies only.
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INSTALL_COMMAND: ${{ inputs.install_command }}
              run: |
                  set -euo pipefail
                  if [[ "${INSTALL_COMMAND}" =~ ^[[:space:]]*npm[[:space:]]+ci([[:space:]]|$) ]] && [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
                      echo "::error::'${INSTALL_COMMAND}' needs a committed package-lock.json. Commit the lockfile (preferred) or pass install_command explicitly."
                      exit 1
                  fi
                  if [[ "${INSTALL_COMMAND}" != *"--ignore-scripts"* ]]; then
                      echo "::warning::install_command '${INSTALL_COMMAND}' runs dependency install scripts; prefer 'npm ci --ignore-scripts' with a committed lockfile."
                  fi
                  bash -c "${INSTALL_COMMAND}"

            - name: Run build script when available
              if: inputs.run_build && steps.published.outputs.exists != 'true'
              working-directory: ${{ inputs.working_directory }}
              run: |
                  set -euo pipefail
                  HAS_BUILD="$(node -e "const p=require('./package.json');process.stdout.write((p.scripts&&p.scripts.build)?'1':'0')")"
                  if [ "${HAS_BUILD}" != "1" ]; then
                      echo "No build script; skipping."
                      exit 0
                  fi
                  npm run build

            - name: Run tests when available
              if: inputs.run_test && steps.published.outputs.exists != 'true'
              working-directory: ${{ inputs.working_directory }}
              run: |
                  set -euo pipefail
                  HAS_TEST="$(node -e "const p=require('./package.json');process.stdout.write((p.scripts&&p.scripts.test)?'1':'0')")"
                  if [ "${HAS_TEST}" != "1" ]; then
                      echo "No test script; skipping."
                      exit 0
                  fi
                  npm test

            - name: Pack
              id: pack
              if: steps.published.outputs.exists != 'true'
              working-directory: ${{ inputs.working_directory }}
              run: |
                  set -euo pipefail
                  mkdir -p "${RUNNER_TEMP}/npm-pack"
                  TARBALL="$(npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/npm-pack" | tail -1)"
                  SHA256="$(sha256sum "${RUNNER_TEMP}/npm-pack/${TARBALL}" | cut -d' ' -f1)"
                  echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
                  echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
                  echo "Packed ${TARBALL} (sha256 ${SHA256})"

            - name: Upload package tarball
              if: steps.published.outputs.exists != 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/npm-pack/${{ steps.pack.outputs.tarball }}
                  if-no-files-found: error
                  retention-days: 3

    publish:
        needs: [build]
        if: needs.build.outputs.exists != 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download package tarball
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/npm-pack

            - name: Verify tarball
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
                  EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
              run: |
                  set -euo pipefail
                  if [[ ! "${TARBALL}" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]; then
                      echo "::error::Unexpected tarball name '${TARBALL}'."
                      exit 1
                  fi
                  ACTUAL="$(sha256sum "${RUNNER_TEMP}/npm-pack/${TARBALL}" | cut -d' ' -f1)"
                  if [ "${ACTUAL}" != "${EXPECTED_SHA256}" ]; then
                      echo "::error::Tarball sha256 ${ACTUAL} does not match the build job's ${EXPECTED_SHA256}."
                      exit 1
                  fi

            - name: Setup Node for GitHub Packages
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node_version }}
                  registry-url: ${{ inputs.registry_url }}
                  scope: ${{ inputs.scope }}

            - name: Publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
                  TARBALL: ${{ needs.build.outputs.tarball }}
                  PKG_NAME: ${{ needs.build.outputs.name }}
                  PKG_VERSION: ${{ needs.build.outputs.version }}
                  REGISTRY_URL: ${{ inputs.registry_url }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -euo pipefail
                  ARGS=(publish "${RUNNER_TEMP}/npm-pack/${TARBALL}" --ignore-scripts --registry "${REGISTRY_URL}")
                  if [ "${DRY_RUN}" = "true" ]; then
                      ARGS+=(--dry-run)
                      echo "Dry run — validating ${PKG_NAME}@${PKG_VERSION} without publishing."
                  fi
                  npm "${ARGS[@]}"

    summary:
        needs: [build, publish]
        if: always()
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Publish summary
              env:
                  PKG_NAME: ${{ needs.build.outputs.name }}
                  PKG_VERSION: ${{ needs.build.outputs.version }}
                  ALREADY_PUBLISHED: ${{ needs.build.outputs.exists }}
                  PUBLISH_RESULT: ${{ needs.publish.result }}
                  SHA256: ${{ needs.build.outputs.sha256 }}
                  REGISTRY_URL: ${{ inputs.registry_url }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -euo pipefail
                  {
                      echo "## GitHub Packages Publish"
                      echo ""
                      echo "- Package: \`${PKG_NAME:-unresolved}@${PKG_VERSION:-unresolved}\`"
                      echo "- Registry: \`${REGISTRY_URL}\`"
                      if [ -n "${SHA256}" ]; then
                          echo "- Tarball sha256: \`${SHA256}\`"
                      fi
                      if [ "${ALREADY_PUBLISHED}" = "true" ]; then
                          echo "- Result: skipped (version already published)"
                      elif [ "${PUBLISH_RESULT}" != "success" ]; then
                          echo "- Result: ${PUBLISH_RESULT:-not run}"
                      elif [ "${DRY_RUN}" = "true" ]; then
                          echo "- Result: dry run (nothing published)"
                      else
                          echo "- Result: published"
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
