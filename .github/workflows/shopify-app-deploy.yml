name: Shopify App Deploy (Canonical)

# Publishes a new Shopify app version (extensions + shopify.app.toml config) via
# `shopify app deploy`. Branch-per-environment: the caller passes `branch`, which
# pins the GitHub Environment (for secrets) and, for multi-environment apps, the
# `--config <name>` selector. See iamota-ai instructions/dev/ci-cd.md.

on:
    workflow_call:
        inputs:
            branch:
                type: string
                required: true
            config:
                description: >-
                    Shopify config name passed to `--config` (selects
                    shopify.app.<config>.toml). Leave empty for a single-environment
                    app to use the committed shopify.app.toml. For a multi-environment
                    app pass the branch name (github.ref_name).
                type: string
                required: false
                default: ""
            working_directory:
                type: string
                required: false
                default: "."
            install_command:
                description: "npm install (not npm ci) — see fly-io.md lockfile note."
                type: string
                required: false
                default: "npm install"
            node_version:
                type: string
                required: false
                # Node baseline — keep in sync with docs/github-actions/node-version.md.
                # Shopify CLI requires Node >= 22.1 (uses module.enableCompileCache).
                default: "24"
            cli_version:
                type: string
                required: false
                default: "latest"
            allow_updates:
                description: >-
                    Pass `--allow-updates` so the deploy doesn't stall on a
                    confirmation prompt in CI. Set false to require manual
                    approval (deploy will fail non-interactively instead).
                type: boolean
                required: false
                default: true
            allow_deletes:
                description: >-
                    Pass `--allow-deletes` so the deploy doesn't stall on a
                    confirmation prompt in CI. Set false for an app where
                    accidental extension deletion is a real risk — the deploy
                    will then fail non-interactively if it would delete
                    anything, rather than doing so unattended.
                type: boolean
                required: false
                default: true
        secrets:
            # App-scoped automation token (preferred — least privilege, per-app).
            # Falls back to the Partner org CLI token when absent. Provide at
            # least one; the deploy job errors if both are empty.
            SHOPIFY_APP_AUTOMATION_TOKEN:
                required: false
            SHOPIFY_CLI_PARTNERS_TOKEN:
                required: false
            SHOPIFY_API_KEY:
                required: false

permissions:
    contents: read

concurrency:
    group: iamota-shopify-app-deploy-${{ github.repository }}-${{ inputs.branch || github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.branch }}
        env:
            # Prefer the app-scoped automation token; fall back to the Partner org
            # CLI token. The deploy step unsets the partners token when the
            # automation token is present so exactly one auth path is active.
            SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
            SHOPIFY_CLI_PARTNERS_TOKEN  : ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
            SHOPIFY_API_KEY             : ${{ secrets.SHOPIFY_API_KEY }}
            COMMIT_URL                  : ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        steps:
            - uses: actions/checkout@v5

            - name: Setup Node + Install Shopify CLI
              uses: iamota/iamota-github-actions/.github/actions/shopify-cli-install@v1
              with:
                  node_version: ${{ inputs.node_version }}
                  cli_version: ${{ inputs.cli_version }}

            - name: Install npm dependencies
              uses: iamota/iamota-github-actions/.github/actions/npm-install@v1
              with:
                  working_directory: ${{ inputs.working_directory }}
                  install_command: ${{ inputs.install_command }}
                  if_package_json: "1"

            - name: Capture commit message
              run: |
                  set -euo pipefail
                  MSG="$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/[^a-zA-Z0-9_ -]//g')"
                  echo "COMMIT_MESSAGE=${MSG}" >> "$GITHUB_ENV"

            - name: Deploy to Shopify
              working-directory: ${{ inputs.working_directory }}
              env:
                  CONFIG_NAME: ${{ inputs.config }}
                  ALLOW_UPDATES: ${{ inputs.allow_updates }}
                  ALLOW_DELETES: ${{ inputs.allow_deletes }}
              run: |
                  set -euo pipefail
                  if [ -z "${SHOPIFY_APP_AUTOMATION_TOKEN:-}" ] && [ -z "${SHOPIFY_CLI_PARTNERS_TOKEN:-}" ]; then
                      echo "::error::Provide SHOPIFY_APP_AUTOMATION_TOKEN (preferred) or SHOPIFY_CLI_PARTNERS_TOKEN."
                      exit 1
                  fi
                  if [ -n "${SHOPIFY_APP_AUTOMATION_TOKEN:-}" ]; then
                      echo "Authenticating with app automation token."
                      unset SHOPIFY_CLI_PARTNERS_TOKEN
                  else
                      echo "Authenticating with Partners CLI token (fallback)."
                  fi
                  ARGS=(app deploy --source-control-url "${COMMIT_URL}" --message "${COMMIT_MESSAGE}")
                  if [ -n "${CONFIG_NAME}" ]; then
                      ARGS+=(--config "${CONFIG_NAME}")
                  fi
                  if [ "${ALLOW_UPDATES}" = "true" ]; then
                      ARGS+=(--allow-updates)
                  fi
                  if [ "${ALLOW_DELETES}" = "true" ]; then
                      ARGS+=(--allow-deletes)
                  fi
                  shopify "${ARGS[@]}"
