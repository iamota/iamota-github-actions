name: "Shopify CLI Install"
description: "Setup Node and install Shopify CLI"
inputs:
    node_version:
        # Node baseline — keep in sync with docs/github-actions/node-version.md.
        description: "Node.js version used for Shopify CLI"
        default: "24"
    cli_version:
        description: "Shopify CLI version (falls back to SHOPIFY_CLI_VERSION, then latest)"
        default: ""
runs:
    using: "composite"
    steps:
        - uses: actions/setup-node@v6
          with:
              node-version: ${{ inputs.node_version }}

        - run: |
              set -euo pipefail
              CLI_VERSION="${CLI_VERSION_INPUT:-${SHOPIFY_CLI_VERSION:-latest}}"
              echo "Installing Shopify CLI: ${CLI_VERSION}"
              npm install -g "@shopify/cli@${CLI_VERSION}"
              command -v shopify >/dev/null
              shopify version
          shell: bash
          env:
              CLI_VERSION_INPUT: ${{ inputs.cli_version }}
