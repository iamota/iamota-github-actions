name: "GitHub PR Comment Marker Set"
description: "Create/update/refresh marker-based PR comment via helper script"
inputs:
    repo:
        required: true
    pr:
        required: true
    marker:
        required: true
    body:
        required: true
    refresh_after_comments:
        required: false
        default: "0"
    scripts_root:
        required: false
        default: ".iamota-actions/.github/scripts/github"
runs:
    using: "composite"
    steps:
        # Inputs go through env, never inline in the script: comment bodies carry
        # branch names and backticks that bash would otherwise execute.
        - env:
              INPUT_SCRIPTS_ROOT: ${{ inputs.scripts_root }}
              INPUT_REPO: ${{ inputs.repo }}
              INPUT_PR: ${{ inputs.pr }}
              INPUT_BODY: ${{ inputs.body }}
              INPUT_MARKER: ${{ inputs.marker }}
              INPUT_REFRESH_AFTER_COMMENTS: ${{ inputs.refresh_after_comments }}
          run: |
              set -euo pipefail
              ROOT="${INPUT_SCRIPTS_ROOT}"
              SCRIPT="${ROOT}/github-pr-comment-marker-set.mjs"

              if [ ! -f "${SCRIPT}" ]; then
                  echo "Missing marker-set script: ${SCRIPT}"
                  exit 1
              fi

              node "${SCRIPT}" \
                --repo "${INPUT_REPO}" \
                --pr "${INPUT_PR}" \
                --marker "${INPUT_MARKER}" \
                --body "${INPUT_BODY}" \
                --refresh-after-comments "${INPUT_REFRESH_AFTER_COMMENTS}"
          shell: bash
