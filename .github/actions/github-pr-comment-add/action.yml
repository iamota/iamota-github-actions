name: "GitHub PR Comment Add"
description: "Add a new PR comment via helper script"
inputs:
    repo:
        required: true
    pr:
        required: true
    body:
        required: true
    scripts_root:
        required: false
        default: ".iamota-actions/.github/scripts/github"
runs:
    using: "composite"
    steps:
        # Inputs go through env, never inline in the script: comment bodies carry
        # branch names and backticks that bash would otherwise execute.
        - env:
              INPUT_SCRIPTS_ROOT: ${{ inputs.scripts_root }}
              INPUT_REPO: ${{ inputs.repo }}
              INPUT_PR: ${{ inputs.pr }}
              INPUT_BODY: ${{ inputs.body }}
          run: |
              set -euo pipefail
              ROOT="${INPUT_SCRIPTS_ROOT}"
              SCRIPT="${ROOT}/github-pr-comment-add.mjs"

              if [ ! -f "${SCRIPT}" ]; then
                  echo "Missing comment-add script: ${SCRIPT}"
                  exit 1
              fi

              node "${SCRIPT}" \
                --repo "${INPUT_REPO}" \
                --pr "${INPUT_PR}" \
                --body "${INPUT_BODY}"
          shell: bash
