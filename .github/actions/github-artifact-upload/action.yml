name: "Upload Artifact"
description: "Upload a folder or file as GitHub Action artifact"
inputs:
    name:
        required: true
    path:
        required: true
runs:
    using: "composite"
    steps:
        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
              name: ${{ inputs.name }}
              path: ${{ inputs.path }}
              if-no-files-found: error
